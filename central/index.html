<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#080b10">
  <title>Central Mobile | Carioca Ticket</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#080b10}
    body{
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:24px;
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:#fff
    }
    .card{
      width:min(92vw,440px);
      padding:28px 24px;
      border:1px solid rgba(241,182,64,.35);
      border-radius:22px;
      background:linear-gradient(180deg,#11151b,#0b0e13);
      text-align:center;
      box-shadow:0 24px 70px rgba(0,0,0,.35)
    }
    .brand{
      font-size:12px;
      font-weight:800;
      letter-spacing:.2em;
      color:#f1b640;
      text-transform:uppercase
    }
    h1{font-size:24px;margin:10px 0 8px}
    p{margin:0;color:#b9c0ca;line-height:1.45}
    .loader{
      width:38px;
      height:38px;
      margin:22px auto 0;
      border-radius:50%;
      border:4px solid rgba(255,255,255,.12);
      border-top-color:#f1b640;
      animation:spin .8s linear infinite
    }
    @keyframes spin{to{transform:rotate(360deg)}}
    a{
      display:none;
      margin-top:22px;
      padding:14px 18px;
      border-radius:14px;
      background:linear-gradient(135deg,#dfa324,#f6c94c);
      color:#111;
      font-weight:900;
      text-decoration:none
    }
    a.show{display:block}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">Carioca Ticket</div>
    <h1>Central Mobile</h1>
    <p>Redirecionando para o acesso oficial…</p>
    <div class="loader" aria-hidden="true"></div>
    <a id="fallback" href="#">Abrir Central Mobile</a>
  </main>

  <script>
    (function(){
      'use strict';

      var params=new URLSearchParams(window.location.search);
      params.delete('page');

      var extra=params.toString();
      var destino="https://script.google.com/macros/s/AKfycbxzpg1Rm876lmZygLqP-HEbHWc49ct0bicDKhOafywr9gHVG571uicgHJ3ZGWXsH2LZ/exec?page=app"+
        (extra?'&'+extra:'')+
        (window.location.hash||'');

      var fallback=document.getElementById('fallback');
      fallback.href=destino;

      /*
       * Rotas autenticadas nao usam iframe.
       * Navegacao direta evita particionamento de storage,
       * bloqueios de iframe e spinners presos entre origens.
       */
      window.location.replace(destino);

      setTimeout(function(){
        fallback.classList.add('show');
      },1800);
    })();
  </script>
</body>
</html>
