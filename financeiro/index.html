<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0">
  <title>Financeiro | Carioca Ticket</title>
  <link rel="manifest" href="/manifest-produtor.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/carioca-ticket-icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="/assets/carioca-ticket-icon-192.png">
  <script src="/pwa-register.js" defer></script>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#090b0f;color:#f4f4f4;font-family:Arial,Helvetica,sans-serif}
    body{display:grid;place-items:center;padding:24px}.card{width:min(520px,100%);padding:28px;border:1px solid #282f3a;border-radius:18px;background:#11151c;text-align:center}
    img{width:86px;height:86px}.gold{color:#e8b34b}p{color:#9ca5b3;line-height:1.55}
  </style>
</head>
<body>
  <main class="card">
    <img src="/assets/carioca-ticket-icon-192.png" alt="Carioca Ticket">
    <h1 class="gold">Conta Carioca Pay</h1>
    <p>O Financeiro do Produtor foi centralizado na Conta Carioca Pay. Redirecionando para a área oficial e protegida.</p>
    <p><a href="/central/" style="color:#e8b34b">Voltar à Central Mobile</a></p>
  </main>
  <script>
    (function(){
      'use strict';
      var params=new URLSearchParams(window.location.search||'');
      var evento=String(params.get('evento')||'').trim();
      var destino='/produtor/financeiro/'+(evento?'?evento='+encodeURIComponent(evento):'');
      window.location.replace(destino);
    }());
  </script>
</body>
</html>
