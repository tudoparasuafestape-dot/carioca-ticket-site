<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0">
<title>Financeiro | Carioca Ticket</title>
<link rel="icon" type="image/png" sizes="192x192" href="/assets/carioca-ticket-icon-192.png">
<link rel="apple-touch-icon" sizes="192x192" href="/assets/carioca-ticket-icon-192.png">
<link rel="manifest" href="/manifest-produtor.webmanifest">
<script src="/pwa-register.js" defer></script>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#090b0f;color:#f4f4f4;font-family:Inter,system-ui,sans-serif}
.card{width:min(520px,calc(100% - 32px));padding:28px;border:1px solid #282f3a;border-radius:20px;background:#11151c;text-align:center}
h1{margin:0 0 10px}p{color:#9ca5b3;line-height:1.55}.btn{display:inline-flex;margin-top:12px;padding:12px 18px;border-radius:11px;background:#e8b34b;color:#111;text-decoration:none;font-weight:900}
</style>
</head>
<body>
<section class="card">
  <h1>Conta Carioca Pay</h1>
  <p>O Financeiro do Produtor agora possui um único fluxo oficial, com solicitações de antecipação sujeitas à análise do Backoffice Master.</p>
  <a id="officialFinanceLink" class="btn" href="/produtor/financeiro/">Abrir Financeiro</a>
</section>
<script>
(function(){
  'use strict';
  var params=new URLSearchParams(window.location.search);
  var evento=String(params.get('evento')||'').trim();
  var destino='/produtor/financeiro/'+(evento?'?evento='+encodeURIComponent(evento):'');
  document.getElementById('officialFinanceLink').href=destino;
  window.location.replace(destino);
}());
</script>
</body>
</html>
