<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#080b10">
  <title>Consulta de Ingressos | Carioca Ticket</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b10}
    body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    #loading{position:fixed;inset:0;z-index:3;display:grid;place-items:center;background:#080b10;color:#fff;transition:opacity .2s ease}
    #loading.hide{opacity:0;pointer-events:none}
    .card{width:min(90vw,440px);padding:28px 24px;border:1px solid rgba(241,182,64,.35);border-radius:22px;background:linear-gradient(180deg,#11151b,#0b0e13);text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.35)}
    .brand{font-size:12px;font-weight:800;letter-spacing:.2em;color:#f1b640;text-transform:uppercase}
    h1{font-size:24px;margin:10px 0 8px}
    p{margin:0;color:#b9c0ca;line-height:1.45}
    .loader{width:40px;height:40px;margin:22px auto 0;border-radius:50%;border:4px solid rgba(255,255,255,.12);border-top-color:#f1b640;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    iframe{display:block;width:100%;height:100%;border:0;background:#fff}
    .fallback{display:none;position:fixed;right:14px;bottom:14px;z-index:4;text-decoration:none;font-size:12px;font-weight:700;color:#111;background:#f1b640;padding:10px 12px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.25)}.fallback.show{display:inline-block}
  </style>
</head>
<body>
  <div id="loading">
    <div class="card">
      <div class="brand">Carioca Ticket</div>
      <h1>Consulta de Ingressos</h1>
      <p>Carregando acesso oficial…</p>
      <div class="loader" aria-hidden="true"></div>
    </div>
  </div>
  <iframe id="app" title="Consultar ingressos" ></iframe>
  <a id="fallback" class="fallback" href="/central/">Voltar à Central Mobile</a>
  <script>
    const p=new URLSearchParams(location.search);p.delete('page');
   const q=p.toString();
   const destino='https://script.google.com/macros/s/AKfycbz28keO65PIIElB8dWMBt8nnEBw9CzBxWnc6nOhAKKGNDkMZnYbWjrhTtr_v-lEI2IAJA/exec?page=ingressos'+(q?'&'+q:'')+location.hash;
    const frame=document.getElementById('app');
    const loading=document.getElementById('loading');
    const fallback=document.getElementById('fallback');
    frame.src=destino;
    fallback.href="/central/";
    let carregou=false;
    frame.addEventListener('load',()=>{
      carregou=true;
      loading.classList.add('hide');
    });
    setTimeout(()=>{
      if(!carregou){
        loading.classList.add('hide');
        fallback.classList.add('show');
      }
    },7000);
  </script>
</body>
</html>
