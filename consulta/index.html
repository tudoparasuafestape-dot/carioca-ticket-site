<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#080b10">
  <title>Consultar ingressos | Carioca Ticket</title>
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080b10;color:#fff;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .card{width:min(92vw,520px);padding:34px 28px;border:1px solid rgba(241,182,64,.35);border-radius:24px;background:linear-gradient(180deg,#11151b,#0b0e13);box-shadow:0 24px 70px rgba(0,0,0,.35);text-align:center}
    .brand{font-size:13px;font-weight:800;letter-spacing:.2em;color:#f1b640;text-transform:uppercase}
    h1{font-size:28px;margin:12px 0 8px}
    p{margin:0;color:#b9c0ca;line-height:1.5}
    .loader{width:42px;height:42px;margin:24px auto 0;border-radius:50%;border:4px solid rgba(255,255,255,.12);border-top-color:#f1b640;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main class="card" aria-live="polite">
    <div class="brand">Carioca Ticket</div>
    <h1>Consultar ingressos</h1>
    <p>Preparando seu acesso seguro…</p>
    <div class="loader" aria-hidden="true"></div>
  </main>
  <script>
    const p=new URLSearchParams(location.search);p.delete('page');
   const q=p.toString();
   location.replace('https://script.google.com/macros/s/AKfycbxzpg1Rm876lmZygLqP-HEbHWc49ct0bicDKhOafywr9gHVG571uicgHJ3ZGWXsH2LZ/exec?page=ingressos'+(q?'&'+q:'')+location.hash);
  </script>
</body>
</html>
