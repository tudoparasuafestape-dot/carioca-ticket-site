<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0">
<title>Conectando Instagram | Carioca Ticket</title>
<link rel="icon" type="image/png" sizes="192x192" href="/assets/carioca-ticket-icon-192.png">
<style>
:root{--bg:#080a0e;--card:#11151c;--line:#29313c;--gold:#e8b34b;--gold2:#f3cb72;--text:#f4f4f4;--muted:#a0a9b6;--ok:#55c789;--bad:#ef6464}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 0,rgba(232,179,75,.18),transparent 28%),linear-gradient(180deg,#080a0e,#07090c 75%);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{width:min(560px,calc(100% - 28px));border:1px solid rgba(232,179,75,.3);background:var(--card);border-radius:22px;padding:24px;text-align:center;box-shadow:0 20px 80px rgba(0,0,0,.3)}img{width:76px;height:76px;object-fit:contain}.ey{margin-top:12px;color:var(--gold2);font-size:10px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}h1{margin:8px 0;font-size:clamp(27px,6vw,38px)}p{margin:0;color:var(--muted);font-size:12px;line-height:1.6}.status{margin-top:16px;border:1px solid var(--line);border-radius:13px;padding:13px;font-size:12px}.status.ok{border-color:#285d41;color:#baf0d1;background:rgba(85,199,137,.07)}.status.error{border-color:#643038;color:#ffc0c0;background:rgba(239,100,100,.07)}a{margin-top:16px;display:inline-flex;min-height:44px;align-items:center;justify-content:center;border:1px solid rgba(232,179,75,.45);border-radius:11px;padding:0 16px;color:var(--gold2);text-decoration:none;font-weight:850}
</style>
</head>
<body>
<main class="card">
  <img src="/assets/carioca-ticket-icon-192.png" alt="Carioca Ticket">
  <div class="ey">Integração social</div>
  <h1>Conectando Instagram</h1>
  <p>Estamos concluindo a autorização no backend seguro da Carioca Ticket. Nenhum access token é exposto nesta página.</p>
  <div id="status" class="status">Validando autorização...</div>
  <a id="backLink" href="/produtor/social/" class="hidden">Voltar às integrações</a>
</main>

<script>
(function(){
'use strict';
var APP_PROD='https://script.google.com/macros/s/AKfycbz28keO65PIIElB8dWMBt8nnEBw9CzBxWnc6nOhAKKGNDkMZnYbWjrhTtr_v-lEI2IAJA/exec';
var APP_DEV='https://script.google.com/macros/s/AKfycbyhx6mnGJMsgpGmx-C1r6ZUXbrE66-X6Rkusp1ulVOGcDfJfIs-jgysWp1PfkqB1UC3hg/exec';
var APP=/^(?:www\.)?cariocaticket\.com\.br$/i.test(location.hostname)?APP_PROD:APP_DEV;
var STORAGE='CT_PORTAL_PRODUTOR_PROD_SESSION_V1';
var RETURN_EVENT='CT_SOCIAL_INSTAGRAM_RETURN_EVENT_V1';
var pending={};

function $(id){return document.getElementById(id)}
function readSession(){try{var raw=sessionStorage.getItem(STORAGE)||localStorage.getItem(STORAGE),d=raw?JSON.parse(raw):null;if(!d||!d.token)return null;if(d.expiraEm&&Date.parse(d.expiraEm)<=Date.now())return null;return d}catch(_){return null}}
function cleanup(id){var p=pending[id];if(!p)return null;delete pending[id];clearTimeout(p.timer);try{p.frame.remove();p.form.remove()}catch(_){}return p}
function rpc(method,args){return new Promise(function(resolve,reject){var id='CTSOC-CB-'+(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random()),name='ctsoc_cb_'+id.replace(/[^A-Za-z0-9_]/g,''),frame=document.createElement('iframe'),form=document.createElement('form');frame.name=name;frame.style.display='none';form.method='POST';form.action=APP;form.target=name;form.style.display='none';function add(k,v){var i=document.createElement('input');i.type='hidden';i.name=k;i.value=String(v==null?'':v);form.appendChild(i)}add('ctMinhaCariocaAction','portalRpc');add('ctMinhaCariocaRequestId',id);add('metodo',method);add('argsJson',JSON.stringify(args||[]));document.body.append(frame,form);pending[id]={frame:frame,form:form,resolve:resolve,reject:reject,timer:setTimeout(function(){var p=cleanup(id);if(p)p.reject(new Error('A operação demorou mais do que o esperado.'))},90000)};form.submit()})}
window.addEventListener('message',function(ev){if(ev.origin!=='https://script.google.com'&&!/\.googleusercontent\.com$/.test(ev.origin||''))return;var x=ev.data;if(!x||x.ctMinhaCariocaPost!==true||!x.id||!pending[x.id])return;var p=cleanup(x.id);if(!p)return;x.ok===true?p.resolve(x.resultado):p.reject(new Error(String(x.erro||'Não foi possível concluir a operação.')))});
function setStatus(text,kind){var e=$('status');e.textContent=text;e.className='status '+(kind||'');$('backLink').classList.remove('hidden')}
function targetUrl(){var eventId=sessionStorage.getItem(RETURN_EVENT)||'';return'/produtor/social/'+(eventId?'?evento='+encodeURIComponent(eventId):'')}
async function boot(){var url=new URL(location.href),error=url.searchParams.get('error'),errorDescription=url.searchParams.get('error_description'),code=String(url.searchParams.get('code')||'').trim(),state=String(url.searchParams.get('state')||'').trim(),session=readSession();$('backLink').href=targetUrl();if(error){setStatus('O Instagram não autorizou a conexão: '+(errorDescription||error),'error');return}if(!session){setStatus('Sua sessão de produtor expirou. Entre novamente no Portal do Produtor e refaça a conexão.','error');$('backLink').href='/produtor/';return}if(!code||!state){setStatus('A resposta do Instagram veio incompleta. Inicie a conexão novamente.','error');return}try{var r=await rpc('ctSocialInstagramOAuthConcluirPROD',[session.token,code,state]);if(!r||r.sucesso!==true)throw new Error('A conexão não foi concluída.');var username=r.conta&&r.conta.username?'@'+r.conta.username:'Instagram';var hook=r.webhookInscrito===true?' Webhook inscrito.':' Conta conectada; o webhook ainda precisa ser reinscrito.';setStatus(username+' conectado com sucesso.'+hook,'ok');history.replaceState(null,'',location.pathname);setTimeout(function(){location.replace(targetUrl())},1600)}catch(e){setStatus(e.message||String(e),'error')}}
boot();
}());
</script>
</body>
</html>
