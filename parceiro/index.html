<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08090c">
  <title>Portal Parceiro CT | Carioca Ticket</title>
  <meta name="description" content="Acesse seu Portal Parceiro Carioca Ticket para acompanhar produtores indicados, vendas elegíveis e comissões.">
  <link rel="canonical" href="https://cariocaticket.com.br/parceiro/">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Carioca Ticket">
  <meta property="og:title" content="Portal Parceiro CT | Carioca Ticket">
  <meta property="og:description" content="Acompanhe produtores indicados, vendas elegíveis e suas comissões no Portal Parceiro CT.">
  <meta property="og:url" content="https://cariocaticket.com.br/parceiro/">
  <meta property="og:image" content="https://cariocaticket.com.br/assets/carioca-ticket-preview-oficial-v9.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#08090c;color:#fff;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{display:grid;place-items:center;padding:24px;background:
      radial-gradient(circle at 80% 0,rgba(232,179,75,.14),transparent 34%),
      #08090c}
    .card{width:min(92vw,460px);padding:28px;border-radius:24px;border:1px solid rgba(232,179,75,.28);
      background:linear-gradient(180deg,#151821,#0d0f14);text-align:center;box-shadow:0 30px 90px rgba(0,0,0,.4)}
    img{width:min(300px,82%);height:92px;object-fit:contain}
    .eyebrow{display:inline-block;margin-top:14px;padding:7px 10px;border-radius:999px;border:1px solid rgba(232,179,75,.28);
      color:#ffd87a;font-size:10px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}
    h1{margin:15px 0 9px;font-size:28px}
    p{margin:0;color:#a3a9b4;line-height:1.55}
    .spinner{width:38px;height:38px;margin:22px auto 0;border-radius:50%;border:4px solid rgba(255,255,255,.12);border-top-color:#e8b34b;animation:spin .8s linear infinite}
    a{display:inline-block;margin-top:22px;color:#17120a;background:linear-gradient(135deg,#ffd87a,#e8b34b);padding:12px 16px;border-radius:12px;text-decoration:none;font-weight:900}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main class="card">
    <img src="/assets/carioca-ticket-logo.png" alt="Carioca Ticket">
    <div class="eyebrow">Parceiro Carioca Ticket</div>
    <h1>Abrindo seu portal...</h1>
    <p>Você será direcionado para o ambiente seguro do Portal Parceiro CT.</p>
    <div class="spinner" aria-hidden="true"></div>
    <a id="fallback" href="https://script.google.com/macros/s/AKfycbz28keO65PIIElB8dWMBt8nnEBw9CzBxWnc6nOhAKKGNDkMZnYbWjrhTtr_v-lEI2IAJA/exec?page=parceiro-ct">Acessar agora</a>
  </main>
  <script>
    (function(){
      var destino='https://script.google.com/macros/s/AKfycbz28keO65PIIElB8dWMBt8nnEBw9CzBxWnc6nOhAKKGNDkMZnYbWjrhTtr_v-lEI2IAJA/exec?page=parceiro-ct';
      window.setTimeout(function(){ window.location.replace(destino); },450);
    })();
  </script>
</body>
</html>
