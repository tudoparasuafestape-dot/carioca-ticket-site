<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="index,follow">
  <meta name="theme-color" content="#080b10">
  <title>Checkout | Carioca Ticket</title>
  <link rel="icon" type="image/png" href="/assets/carioca-ticket-simbolo.png">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b10}
    body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    #loading{position:fixed;inset:0;z-index:3;display:grid;place-items:center;background:radial-gradient(circle at 80% 5%,rgba(223,163,36,.16),transparent 28%),#080b10;color:#fff;transition:opacity .2s ease}
    #loading.hide{opacity:0;pointer-events:none}
    .card{width:min(90vw,460px);padding:30px 24px;border:1px solid rgba(241,182,64,.35);border-radius:22px;background:linear-gradient(180deg,#11151b,#0b0e13);text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.35)}
    .logo{width:132px;max-height:58px;object-fit:contain;margin-bottom:12px}
    .brand{font-size:11px;font-weight:900;letter-spacing:.18em;color:#f1b640;text-transform:uppercase}
    h1{font-size:25px;margin:9px 0 8px}
    p{margin:0;color:#b9c0ca;line-height:1.5}
    .loader{width:40px;height:40px;margin:22px auto 0;border-radius:50%;border:4px solid rgba(255,255,255,.12);border-top-color:#f1b640;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    iframe{display:block;width:100%;height:100%;border:0;background:#080b10}
    .fallback{display:none;position:fixed;right:14px;bottom:14px;z-index:4;text-decoration:none;font-size:12px;font-weight:800;color:#111;background:#f1b640;padding:11px 13px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
    .fallback.show{display:inline-block}
  </style>
</head>
<body>
  <div id="loading">
    <div class="card">
      <img class="logo" src="/assets/carioca-ticket-logo.png" alt="Carioca Ticket">
      <div class="brand">Carioca Ticket</div>
      <h1>Checkout seguro</h1>
      <p>Carregando no ambiente oficial da Carioca Ticket…</p>
      <div class="loader" aria-hidden="true"></div>
    </div>
  </div>
  <iframe id="app" title="Checkout seguro" allow="payment *; clipboard-read *; clipboard-write *" allowfullscreen></iframe>
  <a id="fallback" class="fallback" href="#" target="_blank" rel="noopener">Abrir diretamente</a>
  <script>
    (function(){
      var p=new URLSearchParams(location.search);
      var evento=String(p.get('evento')||'').trim();
      if(!evento){
        document.querySelector('#loading h1').textContent='Evento não informado';
        document.querySelector('#loading p').textContent='Volte para a página de eventos e selecione um evento.';
        document.querySelector('.loader').style.display='none';
        return;
      }
      var destino="https://script.google.com/macros/s/AKfycbz28keO65PIIElB8dWMBt8nnEBw9CzBxWnc6nOhAKKGNDkMZnYbWjrhTtr_v-lEI2IAJA/exec"+'?page=checkout&evento='+encodeURIComponent(evento);
      var frame=document.getElementById('app');
      var loading=document.getElementById('loading');
      var fallback=document.getElementById('fallback');
      frame.src=destino;
      fallback.href=destino;
      var carregou=false;
      frame.addEventListener('load',function(){carregou=true;loading.classList.add('hide');});
      setTimeout(function(){if(!carregou){fallback.classList.add('show');}},8000);
    })();
  </script>
</body>
</html>
