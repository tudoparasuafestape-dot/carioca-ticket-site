<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0">
<title>Eventos Pendentes | Backoffice Master</title>
<link rel="manifest" href="/manifest-produtor.webmanifest">
<link rel="apple-touch-icon" sizes="192x192" href="/assets/carioca-ticket-icon-192.png">
<script src="/pwa-register.js" defer></script>
<style>
:root{--bg:#090b0f;--card:#11151c;--card2:#171c24;--border:#282f3a;--gold:#e8b34b;--gold2:#f3cb72;--text:#f4f4f4;--muted:#9ca5b3;--danger:#ef6464;--success:#55c789}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}
a{text-decoration:none;color:inherit}.top{position:sticky;top:0;z-index:20;background:rgba(9,11,15,.96);border-bottom:1px solid var(--border)}
.topin{max-width:1180px;margin:auto;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px}.brand img{width:34px;height:34px}.brand b{display:block}.brand small{display:block;color:var(--muted)}
.wrap{max-width:1180px;margin:auto;padding:24px 18px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.btn{border:1px solid var(--border);background:var(--card2);color:var(--text);border-radius:10px;padding:10px 13px;font-weight:700;cursor:pointer}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#111}.btn.danger{background:#441a20;border-color:#6e2933;color:#ffd9de}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:16px}.stat,.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:17px}
.stat small,.meta{color:var(--muted)}.stat strong{display:block;font-size:26px;margin-top:5px;color:var(--gold2)}
.list{display:grid;gap:12px}.card h3{margin:0 0 7px}.row{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#342d16;color:var(--gold2);font-size:11px;font-weight:800}.hidden{display:none!important}
.message{padding:12px 14px;border-radius:12px;margin-bottom:14px;background:var(--card2);border:1px solid var(--border)}.message.error{border-color:#6e2933;color:#ffd9de}.message.ok{border-color:#286443;color:#c9f6dc}
.backdrop{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.72);display:grid;place-items:center;padding:18px}.modal{width:min(520px,100%);background:var(--card);border:1px solid var(--border);border-radius:18px;padding:20px}
.field label{display:block;margin-bottom:7px;color:var(--muted);font-size:12px}.field textarea{width:100%;min-height:100px;padding:12px;border-radius:10px;border:1px solid var(--border);background:#0d1015;color:var(--text);resize:vertical}
@media(max-width:720px){.stats{grid-template-columns:1fr}.row{display:block}.head{align-items:flex-start;flex-direction:column}.topin{align-items:flex-start}}
</style>
</head>
<body>
<header class="top"><div class="topin">
<a class="brand" href="/backoffice/"><img src="/assets/carioca-ticket-icon-192.png" alt="Carioca Ticket"><div><b>Eventos Pendentes</b><small>Backoffice Master</small></div></a>
<a class="btn" href="/backoffice/">Voltar ao Backoffice</a>
</div></header>
<main class="wrap">
<div class="head"><div><h1 style="margin:0 0 6px">Governança de eventos</h1><div class="meta">Autorize risco/financeiro sem publicar vendas automaticamente.</div></div><button id="refresh" class="btn" type="button">Atualizar</button></div>
<div id="message" class="message hidden"></div>
<section class="stats"><div class="stat"><small>Pendentes</small><strong id="pendingCount">0</strong></div><div class="stat"><small>Regra</small><strong style="font-size:16px">Master global</strong></div></section>
<div id="list" class="list"></div>
</main>

<div id="decisionBackdrop" class="backdrop hidden" aria-hidden="true">
<section class="modal" role="dialog" aria-modal="true" aria-labelledby="decisionTitle">
<h2 id="decisionTitle">Decisão do evento</h2>
<div id="decisionEvent" class="meta" style="margin-bottom:14px"></div>
<div class="field"><label for="decisionReason">Justificativa <span id="reasonRequired"></span></label><textarea id="decisionReason" maxlength="500"></textarea></div>
<div class="actions" style="justify-content:flex-end"><button id="decisionCancel" class="btn" type="button">Cancelar</button><button id="decisionConfirm" class="btn gold" type="button">Confirmar</button></div>
</section>
</div>

<script>
(function(){
'use strict';
var APP='https://script.google.com/macros/s/AKfycbz28keO65PIIElB8dWMBt8nnEBw9CzBxWnc6nOhAKKGNDkMZnYbWjrhTtr_v-lEI2IAJA/exec';
var STORAGE='CT_PORTAL_PRODUTOR_PROD_SESSION_V1';
var pending={};
var state={session:null,decision:null};

function cleanup(id){var p=pending[id];if(!p)return null;delete pending[id];clearTimeout(p.timer);try{p.frame.remove();p.form.remove()}catch(_){}return p}
function rpc(method,args){
 return new Promise(function(resolve,reject){
  var id='CTEVENTMASTER-'+(crypto&&crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2));
  var frameName='cteventmaster_'+id.replace(/[^A-Za-z0-9_]/g,'');
  var frame=document.createElement('iframe');frame.name=frameName;frame.style.display='none';frame.setAttribute('aria-hidden','true');
  var form=document.createElement('form');form.method='POST';form.action=APP;form.target=frameName;form.style.display='none';
  function add(k,v){var input=document.createElement('input');input.type='hidden';input.name=k;input.value=String(v==null?'':v);form.appendChild(input)}
  add('ctMinhaCariocaAction','portalRpc');add('ctMinhaCariocaRequestId',id);add('metodo',method);add('argsJson',JSON.stringify(Array.isArray(args)?args:[]));
  document.body.append(frame,form);
  pending[id]={frame:frame,form:form,resolve:resolve,reject:reject,timer:setTimeout(function(){var p=cleanup(id);if(p)p.reject(new Error('Tempo esgotado.'))},45000)};
  form.submit();
 });
}
window.addEventListener('message',function(ev){
 if(ev.origin!=='https://script.google.com'&&!/\.googleusercontent\.com$/.test(ev.origin||''))return;
 var payload=ev.data;if(!payload||payload.ctMinhaCariocaPost!==true||!payload.id||!pending[payload.id])return;
 var p=cleanup(payload.id);if(!p)return;
 if(payload.ok===true)p.resolve(payload.resultado);else p.reject(new Error(String(payload.erro||'Não foi possível concluir a operação.')));
});

function readSession(){try{var raw=sessionStorage.getItem(STORAGE)||localStorage.getItem(STORAGE);var s=raw?JSON.parse(raw):null;return s&&s.token?s:null}catch(_){return null}}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})}
function show(msg,type){var el=document.getElementById('message');el.textContent=msg;el.className='message '+(type||'');el.classList.remove('hidden')}
function hideMsg(){document.getElementById('message').classList.add('hidden')}

function render(r){
 var items=r&&Array.isArray(r.itens)?r.itens:[];
 document.getElementById('pendingCount').textContent=String(items.length);
 var list=document.getElementById('list');
 if(!items.length){list.innerHTML='<div class="card"><b>Nenhum evento aguardando autorização.</b><div class="meta" style="margin-top:5px">A fila Master está limpa.</div></div>';return}
 list.innerHTML=items.map(function(i){
  var ev=i.evento||{};
  return '<article class="card"><div class="row"><div><span class="badge">'+esc(i.riscoStatus||'PENDENTE')+'</span><h3>'+esc(ev.nome||i.eventoId)+'</h3><div class="meta">'+esc(i.produtorNome||i.produtorId)+' • '+esc(ev.data||'')+' • '+esc(ev.local||'')+'</div><div class="meta" style="margin-top:5px">Evento: '+esc(i.eventoId)+'</div></div></div><div class="actions"><button class="btn gold" type="button" data-action="AUTORIZAR" data-event="'+esc(i.eventoId)+'" data-name="'+esc(ev.nome||i.eventoId)+'">Autorizar risco/financeiro</button><button class="btn danger" type="button" data-action="BLOQUEAR" data-event="'+esc(i.eventoId)+'" data-name="'+esc(ev.nome||i.eventoId)+'">Bloquear</button></div></article>';
 }).join('');
 list.querySelectorAll('[data-action]').forEach(function(btn){btn.addEventListener('click',function(){openDecision(btn.dataset.event,btn.dataset.name,btn.dataset.action)})});
}

async function load(){
 hideMsg();
 if(!state.session){show('Entre no Portal com sua conta Master antes de acessar esta tela.','error');return}
 document.getElementById('refresh').disabled=true;
 try{
  var r=await rpc('ctEventosGovernancaMasterListarPROD',[state.session.token,{somentePendentes:true}]);
  if(!r||r.sucesso!==true||r.autorizado!==true)throw new Error('Acesso Master não autorizado.');
  render(r);
 }catch(e){show(String(e&&e.message||e||'Não foi possível carregar a fila.'),'error')}
 finally{document.getElementById('refresh').disabled=false}
}
function openDecision(eventId,name,action){
 state.decision={eventId:eventId,action:action};
 document.getElementById('decisionTitle').textContent=action==='AUTORIZAR'?'Autorizar evento':'Bloquear evento';
 document.getElementById('decisionEvent').textContent=name+' • '+eventId;
 document.getElementById('reasonRequired').textContent=action==='BLOQUEAR'?'(obrigatória)':'(opcional)';
 document.getElementById('decisionReason').value='';
 document.getElementById('decisionConfirm').className=action==='BLOQUEAR'?'btn danger':'btn gold';
 document.getElementById('decisionBackdrop').classList.remove('hidden');document.getElementById('decisionBackdrop').setAttribute('aria-hidden','false');
}
function closeDecision(){state.decision=null;document.getElementById('decisionBackdrop').classList.add('hidden');document.getElementById('decisionBackdrop').setAttribute('aria-hidden','true')}
async function decide(){
 if(!state.decision||!state.session)return;
 var reason=String(document.getElementById('decisionReason').value||'').trim();
 if(state.decision.action==='BLOQUEAR'&&reason.length<3){show('Informe a justificativa do bloqueio.','error');return}
 var btn=document.getElementById('decisionConfirm');btn.disabled=true;
 try{
  var r=await rpc('ctEventosGovernancaMasterDecidirPROD',[state.session.token,state.decision.eventId,state.decision.action,reason]);
  if(!r||r.sucesso!==true)throw new Error('Não foi possível registrar a decisão.');
  var action=state.decision.action;closeDecision();
  show(action==='AUTORIZAR'?'Evento autorizado para seguir aos demais gates de publicação.':'Evento bloqueado pela governança Master.','ok');
  await load();
 }catch(e){show(String(e&&e.message||e||'Não foi possível registrar a decisão.'),'error')}
 finally{btn.disabled=false}
}
document.getElementById('refresh').addEventListener('click',load);
document.getElementById('decisionCancel').addEventListener('click',closeDecision);
document.getElementById('decisionConfirm').addEventListener('click',decide);
document.getElementById('decisionBackdrop').addEventListener('click',function(e){if(e.target===this)closeDecision()});
state.session=readSession();
load();
}());
</script>
</body>
</html>
