name: P0 Portal Contract Fix

on:
  push:
    branches:
      - perf/p0-portal-login-hotpath

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/p0-portal-login-hotpath
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ajustar contrato sem mudar o fluxo
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('produtor/index.html')
          s = p.read_text(encoding='utf-8')
          old_log = "'Portal | contexto pós-login'"
          new_log = "'Portal | abertura pós-login'"
          old_msg = "'Não foi possível carregar seus eventos agora. Sua sessão foi preservada; atualize a página para tentar novamente.'"
          new_msg = "'Seu login foi realizado, mas não foi possível carregar toda a área administrativa. Sua sessão foi preservada; atualize a página para tentar novamente.'"

          if old_log in s:
              s = s.replace(old_log, new_log, 1)
          elif new_log not in s:
              raise SystemExit('Marcador pos-login nao localizado')

          if old_msg in s:
              s = s.replace(old_msg, new_msg, 1)
          elif new_msg not in s:
              raise SystemExit('Mensagem pos-login nao localizada')

          p.write_text(s, encoding='utf-8', newline='\n')
          PY

      - name: Validar contratos do Portal
        run: |
          set -euo pipefail
          node tests/contracts.mjs
          node tests/journey-contracts.mjs
          node tests/full-surface-audit.mjs
          node tests/producer-portal-performance.contract.mjs

      - name: Commit apenas se houver mudanca
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- produtor/index.html; then
            echo 'NO_CHANGE'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add produtor/index.html
          git commit -m 'fix: preservar contrato de falha pos-login'
          git push origin HEAD:perf/p0-portal-login-hotpath
