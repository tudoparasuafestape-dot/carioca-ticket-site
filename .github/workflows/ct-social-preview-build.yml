name: Social preview image build validation
on:
  pull_request:
    paths:
      - 'social-preview-build/**'
      - '.github/workflows/ct-pages-publication.yml'
      - '.github/workflows/ct-social-preview-build.yml'
permissions:
  contents: read
concurrency:
  group: ct-social-preview-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded mechanical image converter
        run: |
          python3 -m pip install --disable-pip-version-check --only-binary=:all: --index-url https://pypi.org/simple 'Pillow==12.3.0'
      - name: Validate isolated build modules without live catalogue
        run: node --test social-preview-build/*.test.*
