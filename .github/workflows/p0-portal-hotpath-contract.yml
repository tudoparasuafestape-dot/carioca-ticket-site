name: P0 Portal Hotpath Contract

on:
  push:
    branches:
      - perf/p0-portal-login-hotpath-e2e

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact P0 site branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Portal P0 contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('produtor/index.html').read_text(encoding='utf-8')
          required = [
              'contextoPendente',
              'ctPortalProdutorLoginFirebaseHotpathP0PROD',
              'ctPortalProdutorRestaurarSessaoIsoladaPROD',
              'abrirShellPortalPendente',
              'carregarContextoPortalPendente',
              'Carregando seus eventos...'
          ]
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit('Missing P0 portal contract markers: ' + ', '.join(missing))
          scripts = re.findall(r'<script([^>]*)>(.*?)</script>', html, re.S | re.I)
          if not scripts:
              raise SystemExit('No script blocks found')
          out = Path('.tmp-p0-scripts')
          out.mkdir(exist_ok=True)
          for i, (attrs, body) in enumerate(scripts, 1):
              suffix = '.mjs' if 'type="module"' in attrs or "type='module'" in attrs else '.js'
              (out / f'script-{i}{suffix}').write_text(body, encoding='utf-8')
          print(f'Extracted {len(scripts)} script blocks')
          PY

      - name: JavaScript syntax for inline scripts
        run: |
          for f in .tmp-p0-scripts/*; do
            echo "Checking $f"
            node --check "$f"
          done

      - name: Confirm clean diff
        run: |
          git diff --check
          git status --short --branch
