name: Event directions isolated
on:
  pull_request:
    paths:
      - 'assets/event-map-preview.*'
      - 'evento/index.html'
      - 'evento-v2/index.html'
      - 'assets/event-directions.*'
      - 'assets/event-accessibility.css'
      - 'tests/event-directions-*'
      - '.github/workflows/event-directions-isolated.yml'
permissions:
  contents: read
jobs:
  directions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node tests/event-directions-contract.cjs
      - run: pip install playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/event-directions-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: event-directions-review
          path: test-results/event-directions/

