name: CT P0 T2 watchdog exec

on:
  push:
    branches:
      - perf/p0-portal-login-hotpath
    paths:
      - '.github/workflows/ct-p0-t2-watchdog-exec.yml'

permissions:
  contents: write

defaults:
  run:
    shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"

jobs:
  apply-test-push:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90
    env:
      CT_BASE_URL: http://127.0.0.1:4173
      CT_EXPECTED_HOST: 127.0.0.1
      CT_BRANCH_MODE: '1'
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@v4
        with:
          ref: perf/p0-portal-login-hotpath
          fetch-depth: 0
          clean: true

      - name: Barrier 1
        run: |
          $ErrorActionPreference='Stop'
          Write-Host "RUNNER_NAME=$env:RUNNER_NAME"
          Write-Host "RUNNER_OS=$env:RUNNER_OS"
          Write-Host "RUNNER_ARCH=$env:RUNNER_ARCH"
          $head=(git rev-parse HEAD).Trim()
          $parent=(git rev-parse HEAD^1).Trim()
          Write-Host "HEAD=$head"
          Write-Host "PARENT=$parent"
          if($head -ne '${{ github.sha }}'){throw 'HEAD diverge de github.sha'}
          if($parent -ne 'aeabdccf31e7f9036e76ff36690eb1b48a865336'){throw "Parent inseguro: $parent"}
          $changed=@(git diff --name-only HEAD^1 HEAD)
          if($changed.Count -ne 1 -or $changed[0] -ne '.github/workflows/ct-p0-t2-watchdog-exec.yml'){throw 'Commit intermediario contem arquivo nao autorizado'}
          if(@(git status --short).Count -ne 0){throw 'Working tree sujo'}
          Write-Host 'BARRIER_1=PASS'

      - name: Structural atomic edit from canonical payload
        run: |
          $ErrorActionPreference='Stop'
          $wf = Get-Content '.github/workflows/ct-p0-t2-watchdog-apply.yml' -Raw
          $m = [regex]::Match($wf, 'EDITOR_B64:\s*"([^"]+)"')
          if(-not $m.Success){throw 'EDITOR_B64 nao encontrado no workflow fonte'}
          $env:EDITOR_B64 = $m.Groups[1].Value
          python -c "import os,base64; src=base64.b64decode(os.environ['EDITOR_B64']).decode('latin-1'); exec(compile(src,'.ct_t2_edit.py','exec'))"
          if($LASTEXITCODE -ne 0){throw "Structural editor failed: $LASTEXITCODE"}
          Remove-Item Env:EDITOR_B64 -ErrorAction SilentlyContinue
          Write-Host 'STRUCTURAL_EDIT=PASS'

      - name: Sanitize generated literals, timing measurement and test typos
        run: |
          $ErrorActionPreference='Stop'
          @'
          from pathlib import Path
          import re

          files=[Path('produtor/index.html'),Path('tests/e2e/authenticated-operational.spec.js')]
          wrong='sess'+chr(0x00e1)+'o'
          right='sess'+chr(0x00e3)+'o'
          for p in files:
              txt=p.read_text(encoding='utf-8')
              txt=txt.replace(wrong,right).replace('toBEGreaterThanOrEqual','toBeGreaterThanOrEqual').replace('supplierMutationCals','supplierMutationCalls')
              p.write_text(txt,encoding='utf-8',newline='\n')

          p=Path('tests/e2e/authenticated-operational.spec.js')
          txt=p.read_text(encoding='utf-8')

          def bounds(title):
              marker="  test('"+title+"'"
              if txt.count(marker)!=1:
                  raise SystemExit(f'{title}: marcador esperado 1, obtido {txt.count(marker)}')
              start=txt.index(marker)
              end=txt.find("\n  test('", start+len(marker))
              if end<0:
                  raise SystemExit(f'{title}: fim do bloco nao encontrado')
              return start,end

          title1='Portal preserva sessao local quando restauracao falha transitoriamente'
          s,e=bounds(title1)
          b=txt[s:e]
          goto1="    await page.goto('/produtor/', { waitUntil: 'domcontentloaded' });"
          if b.count(goto1)!=1:
              raise SystemExit(f'critical goto count={b.count(goto1)}')
          b=b.replace('    const inicio = Date.now();\n','',1)
          b=b.replace(goto1, goto1+"\n    await expect(page.locator('#portalMessage')).toContainText('Carregando seus eventos...', { timeout: 3000 });\n    const inicio = Date.now();",1)
          if b.count('expect(Date.now() - inicio).toBeLessThan(10000);')!=1:
              raise SystemExit('critical timing assertion ausente')
          txt=txt[:s]+b+txt[e:]

          title2='Portal encerra loading T2 entre 8,5s e 10s quando RPC fica pendurado'
          s,e=bounds(title2)
          b=txt[s:e]
          pattern=r"    const inicio=Date\.now\(\);\s*await page\.goto\('/produtor/',\{waitUntil:'domcontentloaded'\}\);"
          matches=list(re.finditer(pattern,b))
          if len(matches)!=1:
              raise SystemExit(f'watchdog inicio count={len(matches)}')
          replacement="    await page.goto('/produtor/',{waitUntil:'domcontentloaded'});\n    await expect(page.locator('#portalMessage')).toContainText('Carregando seus eventos...',{timeout:3000});\n    const inicio=Date.now();"
          b=re.sub(pattern,replacement,b,count=1)
          if b.count('WATCHDOG_ELAPSED_MS=')!=1:
              raise SystemExit('watchdog metric ausente')
          txt=txt[:s]+b+txt[e:]

          p.write_text(txt,encoding='utf-8',newline='\n')
          print('SANITIZE=PASS')
          '@ | python -
          if($LASTEXITCODE -ne 0){throw 'Sanitize failed'}
          $bad=@()
          foreach($f in @('produtor/index.html','tests/e2e/authenticated-operational.spec.js')){
            $txt=Get-Content $f -Raw
            if($txt.Contains('toBEGreaterThanOrEqual')){$bad += "$f:toBEGreaterThanOrEqual"}
            if($txt.Contains('supplierMutationCals')){$bad += "$f:supplierMutationCals"}
          }
          if($bad.Count -gt 0){$bad | Write-Host; throw 'Typos remanescentes'}
          Write-Host 'SANITIZE_GUARD=PASS'

      - name: Diff barrier and audit
        run: |
          $ErrorActionPreference='Stop'
          git diff --check
          if($LASTEXITCODE -ne 0){throw 'git diff --check falhou'}
          Write-Host 'GIT_DIFF_CHECK=PASS'
          git diff --stat
          $changed=@(git diff --name-only)
          $changed | ForEach-Object {Write-Host "CHANGED_FILE=$_"}
          $allowed=@('produtor/index.html','tests/e2e/authenticated-operational.spec.js')
          if($changed.Count -ne 2){throw 'Quantidade de arquivos alterados invalida'}
          foreach($f in $changed){if($allowed -notcontains $f){throw "Arquivo fora do escopo: $f"}}
          node --check tests/e2e/authenticated-operational.spec.js
          if($LASTEXITCODE -ne 0){throw 'Sintaxe do teste invalida'}

      - name: Install frontend dependencies
        run: |
          $ErrorActionPreference='Stop'
          npm.cmd install --no-audit --no-fund --package-lock=false
          if($LASTEXITCODE -ne 0){throw 'npm install falhou'}
          npx.cmd playwright install chromium
          if($LASTEXITCODE -ne 0){throw 'playwright install chromium falhou'}

      - name: Start local branch server
        run: |
          $ErrorActionPreference='Stop'
          $proc=Start-Process -FilePath 'python' -ArgumentList '-m','http.server','4173','--bind','127.0.0.1' -WindowStyle Hidden -PassThru
          Write-Host "HTTP_SERVER_PID=$($proc.Id)"
          $ok=$false
          for($i=1;$i -le 20;$i++){
            try{
              $r=Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:4173/' -TimeoutSec 2
              if($r.StatusCode -eq 200){$ok=$true;break}
            }catch{}
            Start-Sleep -Seconds 1
          }
          if(-not $ok){throw 'Servidor local nao iniciou'}
          Write-Host 'LOCAL_SERVER=PASS'

      - name: Critical transient restore test desktop
        run: |
          npx.cmd playwright test tests/e2e/authenticated-operational.spec.js --project=desktop-chromium --grep "Portal preserva sessao local quando restauracao falha transitoriamente" --workers=1 --retries=0

      - name: Watchdog focused scenarios desktop
        run: |
          npx.cmd playwright test tests/e2e/authenticated-operational.spec.js --project=desktop-chromium --grep "Portal (encerra loading T2|retry bem sucedido|logout durante restore|restaura normalmente antes do watchdog|sessao explicitamente invalida|F5 com sessao valida|F5 apos logout)" --workers=1 --retries=0

      - name: Authenticated operational desktop
        run: |
          npx.cmd playwright test tests/e2e/authenticated-operational.spec.js --project=desktop-chromium --workers=1 --retries=0

      - name: Authenticated operational mobile
        run: |
          npx.cmd playwright test tests/e2e/authenticated-operational.spec.js --project=mobile-chromium --workers=1 --retries=0

      - name: Relevant contracts
        run: |
          $ErrorActionPreference='Stop'
          node tests/contracts.mjs
          node tests/journey-contracts.mjs
          node tests/full-surface-audit.mjs
          if(Test-Path 'tests/producer-portal-performance.contract.mjs'){node tests/producer-portal-performance.contract.mjs}

      - name: Final barrier commit and push
        run: |
          $ErrorActionPreference='Stop'
          Remove-Item -Recurse -Force playwright-report,test-results -ErrorAction SilentlyContinue
          git diff --check
          if($LASTEXITCODE -ne 0){throw 'git diff --check final falhou'}
          $changed=@(git diff --name-only)
          $allowed=@('produtor/index.html','tests/e2e/authenticated-operational.spec.js')
          if($changed.Count -ne 2){throw 'Delta final invalido'}
          foreach($f in $changed){if($allowed -notcontains $f){throw "Delta final fora do escopo: $f"}}
          git add produtor/index.html tests/e2e/authenticated-operational.spec.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: limitar espera T2 do Portal e ignorar callbacks tardios'
          $sha=(git rev-parse HEAD).Trim()
          Write-Host "CORRECTION_SHA=$sha"
          git push origin HEAD:perf/p0-portal-login-hotpath
