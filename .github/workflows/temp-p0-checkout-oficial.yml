name: TEMP P0 Checkout Oficial

on:
  push:
    branches:
      - feat/p0-checkout-politica-comercial-20261007
    paths:
      - .github/workflows/temp-p0-checkout-oficial.yml

permissions:
  contents: write

jobs:
  aplicar-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p0-checkout-politica-comercial-20261007
          fetch-depth: 0

      - name: Aplicar patch deterministico
        run: python .github/p0_patch_checkout_oficial.py

      - name: Executar contratos do site
        run: |
          node tests/politica-comercial.contract.mjs
          npm run test:contracts

      - name: Commit do patch validado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: integrar politica comercial no checkout oficial"
          git push origin HEAD:feat/p0-checkout-politica-comercial-20261007
