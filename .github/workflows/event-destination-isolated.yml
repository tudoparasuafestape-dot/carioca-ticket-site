name: Event destination editor (isolated)
on:
  pull_request:
    paths:
      - 'produtor/destino/**'
      - 'eventos-v2/index.html'
      - 'assets/event-destination-*'
      - 'assets/event-uber.js'
      - 'tests/event-destination-*'
      - '.github/workflows/event-destination-isolated.yml'
permissions:
  contents: read
jobs:
  isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-package-lock
      - run: npx playwright install --with-deps chromium
      - run: |
          node --check assets/event-destination-editor.js
          node tests/event-destination-contract.cjs
          node tests/event-destination-editor-runtime.cjs
          node tests/event-uber-contract.cjs
          node tests/event-destination-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: event-destination-editor
          path: test-results/event-destination
