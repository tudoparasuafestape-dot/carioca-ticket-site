name: Checkout home navigation (isolated fixtures)
on:
  pull_request:
    paths:
      - 'checkout/index.html'
      - 'checkout-v2/index.html'
      - 'assets/checkout-home-navigation.*'
      - 'tests/checkout-home-navigation*'
      - '.github/workflows/checkout-home-navigation-isolated.yml'
permissions:
  contents: read
jobs:
  checkout-home:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Navigation lifecycle and no-side-effect contracts
        run: node tests/checkout-home-navigation.runtime.cjs
      - name: Existing checkout DOM and payment-contract regression (mock RPC only)
        run: node tests/checkout-era-beauty.dom.js
      - name: Checkout home navigation, focus and recovery (all requests mocked)
        env:
          CT_EVIDENCE_DIR: test-results/checkout-home-navigation
        run: node tests/checkout-home-navigation.browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkout-home-navigation-review
          path: test-results/checkout-home-navigation
