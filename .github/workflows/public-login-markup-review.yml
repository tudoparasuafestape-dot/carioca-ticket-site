name: Public login markup (isolated)
on:
  pull_request:
    paths:
      - 'minha-carioca/login/index.html'
      - 'minha-carioca/acesso/index.html'
      - 'tests/public-login-markup*'
      - '.github/workflows/public-login-markup-review.yml'
permissions:
  contents: read
jobs:
  markup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node tests/public-login-markup-contract.cjs
      - run: pip install playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/public-login-markup-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-login-markup-review
          path: test-results/public-login-markup/
