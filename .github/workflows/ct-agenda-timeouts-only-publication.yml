# Local candidate. Install/merge only within owner's agenda publication approval.
name: Agenda timeouts-only pinned Pages publication
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: PUBLISH_AGENDA_TIMEOUTS_ONLY
        required: true
        type: string
      expected_guard_sha:
        description: Exact reviewed main SHA with successful homologacao
        required: true
        type: string
permissions:
  contents: read
  actions: read
  deployments: read
  pages: write
  id-token: write
concurrency:
  group: ct-pages-production
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.repository == 'tudoparasuafestape-dot/carioca-ticket-site'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      CT_EXPECTED_GUARD_SHA: ${{ inputs.expected_guard_sha }}
      CT_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Validate immutable invocation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_SHA" = "$CT_EXPECTED_GUARD_SHA"
          [[ "$CT_EXPECTED_GUARD_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$CT_CONFIRMATION" = PUBLISH_AGENDA_TIMEOUTS_ONLY
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_guard_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline guard negative controls
        run: python3 -m unittest discover -s release/agenda-timeouts -p 'test_*.py'
      - name: Read verified baseline and prepare two-timeout overlay
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 release/agenda-timeouts/release_guard.py prepare "$RUNNER_TEMP/ct-agenda"
      - uses: actions/upload-artifact@v4
        with:
          name: agenda-rollback-and-seal
          path: |
            ${{ runner.temp }}/ct-agenda/rollback.tar
            ${{ runner.temp }}/ct-agenda/seal.json
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/ct-agenda/artifact.tar
          retention-days: 30
          if-no-files-found: error
          overwrite: false
      - name: Recheck deployment and sealed artifact immediately before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 release/agenda-timeouts/release_guard.py recheck "$RUNNER_TEMP/ct-agenda"
      - name: Publish exact sealed artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
        with:
          artifact_name: github-pages
