name: Carioca Ticket - Probe Apps Script PROD

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe publico Apps Script PROD
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://script.google.com/macros/s/AKfycbz28keO65PIIElB8dWMBt8nnEBw9CzBxWnc6nOhAKKGNDkMZnYbWjrhTtr_v-lEI2IAJA/exec"
          ROOT_FILE="$(mktemp)"
          PORTAL_FILE="$(mktemp)"
          ROOT_CODE="$(curl -L -sS --max-time 45 -o "$ROOT_FILE" -w '%{http_code}' "$BASE_URL")"
          PORTAL_CODE="$(curl -L -sS --max-time 45 -o "$PORTAL_FILE" -w '%{http_code}' "$BASE_URL?page=produtor")"
          echo "PUBLIC_PROBE root=$ROOT_CODE portal=$PORTAL_CODE"
          if [ "$ROOT_CODE" != "200" ] || [ "$PORTAL_CODE" != "200" ]; then
            echo "----- ROOT 403 TEXTO VISIVEL -----"
            sed -E 's/<script[^>]*>[[:space:][:print:]]*<\/script>/ /g; s/<style[^>]*>[[:space:][:print:]]*<\/style>/ /g; s/<[^>]+>/ /g' "$ROOT_FILE" | tr '\n' ' ' | tr -s ' ' | head -c 5000 || true
            echo
            echo "----- PORTAL 403 TEXTO VISIVEL -----"
            sed -E 's/<script[^>]*>[[:space:][:print:]]*<\/script>/ /g; s/<style[^>]*>[[:space:][:print:]]*<\/style>/ /g; s/<[^>]+>/ /g' "$PORTAL_FILE" | tr '\n' ' ' | tr -s ' ' | head -c 5000 || true
            echo
            echo "----- ROOT 403 FINAL -----"
            tail -c 5000 "$ROOT_FILE" | tr '\n' ' ' | head -c 5000 || true
            echo
            echo "::error::Apps Script PROD nao respondeu 200 fora do runner local."
            exit 1
          fi
          grep -q "API do Carioca Ticket funcionando" "$ROOT_FILE"
          grep -q "Portal do Produtor" "$PORTAL_FILE"
          echo "CT_PROD_PUBLIC_PROBE_OK"

          EVENT_ID="EVT-11102026-RODA-DE-SAMBA-ESTILO-CARIOCA-9397A2FD"
          EVENT_FILE="$(mktemp)"
          CHECKOUT_FILE="$(mktemp)"
          EVENT_CODE="$(curl -L -sS --max-time 60 -o "$EVENT_FILE" -w '%{http_code}' -X POST             --data-urlencode "ctMinhaCariocaAction=publicRpc"             --data-urlencode "ctMinhaCariocaRequestId=CTPROBE-EVENTO"             --data-urlencode "metodo=ctEventoPublicoCarregarPROD"             --data-urlencode "argsJson=[\"$EVENT_ID\"]"             "$BASE_URL")"
          CHECKOUT_CODE="$(curl -L -sS --max-time 60 -o "$CHECKOUT_FILE" -w '%{http_code}' -X POST             --data-urlencode "ctMinhaCariocaAction=publicRpc"             --data-urlencode "ctMinhaCariocaRequestId=CTPROBE-CHECKOUT"             --data-urlencode "metodo=ctCheckoutPublicoCarregarEventoPROD"             --data-urlencode "argsJson=[\"$EVENT_ID\"]"             "$BASE_URL")"
          echo "PUBLIC_RPC_PROBE evento=$EVENT_CODE checkout=$CHECKOUT_CODE"
          echo "----- EVENT RPC BODY -----"
          head -c 4000 "$EVENT_FILE" || true
          echo
          echo "----- CHECKOUT RPC BODY -----"
          head -c 4000 "$CHECKOUT_FILE" || true
          echo
          test "$EVENT_CODE" = "200"
          test "$CHECKOUT_CODE" = "200"
          grep -q "Roda de Samba Estilo Carioca" "$EVENT_FILE"
          grep -q "Individual" "$CHECKOUT_FILE"
          grep -q "Pré-venda" "$CHECKOUT_FILE"
          echo "CT_EVENT_AND_CHECKOUT_READONLY_PROBE_OK"

