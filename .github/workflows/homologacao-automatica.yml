name: Homologacao automatica Carioca Ticket

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - audit-homologacao-automatica-20260920
      - release/rc-produtor-modalidades-20260925
  schedule:
    - cron: '15 7 * * *'

concurrency:
  group: homologacao-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contratos:
    name: Contratos de regressao
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validar rotas, contratos e jornadas protegidas
        run: |
          node tests/contracts.mjs
          node tests/journey-contracts.mjs
          node tests/full-surface-audit.mjs
          node tests/politica-comercial.contract.mjs
          node tests/eventos-privados-v1.mjs
          node tests/campanhas-recompensas.contract.mjs
          node tests/comissoes-promotores.contract.mjs
          node tests/producer-portal-performance.contract.mjs
          python3 tests/checkout_gratuito_contract.py
  publico-producao:
    name: Jornada publica com fixtures ${{ matrix.viewport }}
    needs: contratos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        viewport: [desktop, mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar Playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Executar cenarios preservados com rede bloqueada
        run: npx playwright test tests/e2e/public-journey.spec.js tests/e2e/partner-public-production.spec.js --config=playwright.canary.config.cjs --project=${{ matrix.viewport }}-chromium
      - name: Guardar resultados e decisoes de rede
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publico-producao-fixtures-${{ matrix.viewport }}
          path: test-results/
          retention-days: 14

  operacional-producao:
    name: Entradas operacionais com fixtures ${{ matrix.viewport }}
    needs: contratos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        viewport: [desktop, mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar Playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Executar cenarios preservados com rede bloqueada
        run: npx playwright test tests/e2e/operational-entry.spec.js --config=playwright.canary.config.cjs --project=${{ matrix.viewport }}-chromium
      - name: Guardar resultados e decisoes de rede
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operacional-producao-fixtures-${{ matrix.viewport }}
          path: test-results/
          retention-days: 14

  facadas-branch:
    name: Facadas first-party branch ${{ matrix.viewport }}
    needs: contratos
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        viewport: [desktop, mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar Playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Subir codigo da branch localmente
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/ct-http.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ct-http.log
          exit 1
      - name: Testar facadas sem tocar producao
        env:
          CT_BASE_URL: http://127.0.0.1:4173
          CT_EXPECTED_HOST: 127.0.0.1
          CT_BRANCH_MODE: '1'
        run: |
          if [ "${{ matrix.viewport }}" = "desktop" ]; then
            npx playwright test tests/e2e/first-party-facades.spec.js tests/e2e/authenticated-operational.spec.js tests/e2e/critical-matrix.spec.js tests/e2e/partner-onboarding.spec.js tests/e2e/producer-onboarding.spec.js tests/e2e/producer-portal-first-paint.spec.js tests/e2e/navigation-journey.spec.js tests/e2e/checkin-journey.spec.js tests/e2e/supplier-journey.spec.js tests/e2e/buyer-journey.spec.js tests/e2e/coupon-journey.spec.js tests/e2e/backoffice-master.spec.js tests/e2e/producer-finance-master.spec.js tests/e2e/producer-finance-activation.spec.js tests/e2e/producer-event-governance.spec.js tests/e2e/producer-courtesy.spec.js tests/e2e/producer-campaign-reward.spec.js tests/e2e/producer-commissions.spec.js tests/e2e/politica-comercial.spec.js tests/e2e/p0-polling-checkout.spec.js tests/e2e/p0-ticket-open-after-payment.spec.js tests/e2e/p0-ticket-actions.spec.js tests/e2e/public-event-catalog.spec.js tests/e2e/era-approved-visual.spec.js --project=desktop-chromium
          else
            npx playwright test tests/e2e/first-party-facades.spec.js tests/e2e/authenticated-operational.spec.js tests/e2e/critical-matrix.spec.js tests/e2e/partner-onboarding.spec.js tests/e2e/producer-onboarding.spec.js tests/e2e/producer-portal-first-paint.spec.js tests/e2e/navigation-journey.spec.js tests/e2e/checkin-journey.spec.js tests/e2e/supplier-journey.spec.js tests/e2e/buyer-journey.spec.js tests/e2e/coupon-journey.spec.js tests/e2e/backoffice-master.spec.js tests/e2e/producer-finance-master.spec.js tests/e2e/producer-finance-activation.spec.js tests/e2e/producer-event-governance.spec.js tests/e2e/producer-courtesy.spec.js tests/e2e/producer-campaign-reward.spec.js tests/e2e/producer-commissions.spec.js tests/e2e/politica-comercial.spec.js tests/e2e/p0-polling-checkout.spec.js tests/e2e/p0-ticket-open-after-payment.spec.js tests/e2e/p0-ticket-actions.spec.js tests/e2e/public-event-catalog.spec.js tests/e2e/era-approved-visual.spec.js --project=mobile-chromium
          fi
      - name: Guardar evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: facadas-branch-${{ matrix.viewport }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Guardar capturas do catalogo publico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalogo-publico-${{ matrix.viewport }}
          path: |
            test-results/**/catalog-viewport.png
            test-results/**/catalog-three-events.png
          if-no-files-found: warn
          retention-days: 14

  canario-real:
    name: Canarios funcionais com fixtures ${{ matrix.viewport }}
    needs: contratos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        viewport: [desktop, mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar Playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Oito canarios funcionais sem backend real
        run: npx playwright test tests/e2e/canary-real.spec.js --config=playwright.canary.config.cjs --project=${{ matrix.viewport }}-chromium
      - name: Guardar resultados e decisoes de rede
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canarios-fixtures-${{ matrix.viewport }}
          path: test-results/
          retention-days: 14

  seguranca-rede:
    name: Isolamento de rede e contratos PWA
    needs: contratos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar Playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Controles negativos e PWA em loopback
        run: |
          node tests/safety/public-request-policy.test.cjs
          node tests/safety/published-static.test.cjs
          node tests/safety/network-isolation.browser.cjs
          node tests/safety/telemetry-isolated.browser.cjs
          node tests/safety/pwa-isolated.cjs
      - name: Guardar captura local de telemetria
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telemetria-isolada
          path: test-results/telemetry-isolated.json
          retention-days: 14

  publicado-estatico:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    name: Publicado - somente arquivos estaticos sem RPC
    needs: [contratos, publico-producao, operacional-producao, facadas-branch, canario-real, seguranca-rede]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Comparar arquivos publicados ao checkout sem executar JavaScript
        run: node tests/safety/published-static.cjs --base-url https://cariocaticket.com.br
      - name: Guardar hashes e metodos consultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publicado-estatico
          path: test-results/published-static.json
          retention-days: 14
