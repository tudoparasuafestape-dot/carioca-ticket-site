name: Homologacao automatica Carioca Ticket

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - audit-homologacao-automatica-20260920
  schedule:
    - cron: '15 7 * * *'

concurrency:
  group: homologacao-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contratos:
    name: Contratos de regressao
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validar rotas e contratos protegidos
        run: node tests/contracts.mjs

  branch-e2e:
    name: Branch E2E ${{ matrix.viewport }}
    needs: contratos
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        viewport: [desktop, mobile]

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Subir branch localmente
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/ct-http.log 2>&1 &
          echo $! > /tmp/ct-http.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ct-http.log
          exit 1

      - name: Homologar codigo da branch
        env:
          CT_BASE_URL: http://127.0.0.1:4173
          CT_EXPECTED_HOST: 127.0.0.1
          CT_BRANCH_MODE: '1'
        run: |
          if [ "${{ matrix.viewport }}" = "desktop" ]; then
            npx playwright test --project=desktop-chromium
          else
            npx playwright test --project=mobile-chromium
          fi

      - name: Guardar evidencias da branch
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: branch-evidencias-${{ matrix.viewport }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  producao-e2e:
    name: Producao E2E ${{ matrix.viewport }}
    needs: contratos
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        viewport: [desktop, mobile]

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Homologar site publicado
        env:
          CT_BASE_URL: https://cariocaticket.com.br
          CT_EXPECTED_HOST: cariocaticket.com.br
          CT_BRANCH_MODE: '0'
        run: |
          if [ "${{ matrix.viewport }}" = "desktop" ]; then
            npx playwright test --project=desktop-chromium
          else
            npx playwright test --project=mobile-chromium
          fi

      - name: Guardar evidencias de producao
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: producao-evidencias-${{ matrix.viewport }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
