name: TEMP P0 Checkout Gate Hardening

on:
  push:
    branches:
      - feat/p0-checkout-politica-comercial-20261007
    paths:
      - .github/workflows/temp-p0-fix-checkout-gate.yml

permissions:
  contents: write

jobs:
  aplicar-validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p0-checkout-politica-comercial-20261007
          fetch-depth: 0

      - name: Aplicar correção determinística
        run: python .github/p0_fix_checkout_gate.py

      - name: Validar contratos
        run: |
          node tests/politica-comercial.contract.mjs
          npm run test:contracts

      - name: Commit do patch validado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: preservar checkout legado quando politica estiver desligada"
          git push origin HEAD:feat/p0-checkout-politica-comercial-20261007
