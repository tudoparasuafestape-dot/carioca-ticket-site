name: Temporal interface (isolated fixtures)
on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'evento/**'
      - 'evento-v2/**'
      - 'checkout/**'
      - 'checkout-v2/**'
      - 'produtor/ingressos/**'
      - 'assets/public-catalog-clock.js'
      - 'assets/public-event-catalog.js'
      - 'assets/public-lot-status.*'
      - 'tests/*temporal*'
      - 'tests/producer-effective-lots.cjs'
      - 'tests/fixtures/checkout-temporal-dom.cjs'
      - '.github/workflows/temporal-interface-isolated.yml'
permissions:
  contents: read
jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Execute actual UI controllers with closed local mocks
        run: |
          node tests/catalog-temporal-rebuild.cjs
          node --test tests/checkout-temporal-rebuild.cjs
          node --test tests/event-temporal-rebuild.cjs
          node tests/producer-effective-lots.cjs
          node tests/checkout-era-beauty.dom.js
          node tests/safety/public-request-policy.test.cjs
  isolated-browser:
    needs: offline-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Exercise event and checkout pages with all requests intercepted
        run: |
          checkout_status=0
          node tests/checkout-temporal-rebuild.browser.cjs || checkout_status=$?
          event_status=0
          node --test tests/event-temporal-rebuild.browser.cjs || event_status=$?
          test "$checkout_status" -eq 0 && test "$event_status" -eq 0
