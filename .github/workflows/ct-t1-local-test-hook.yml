name: CT T1 local test hook

on:
  push:
    branches:
      - hotfix/portal-login-t1-timeout
    paths:
      - '.github/workflows/ct-t1-local-test-hook.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/portal-login-t1-timeout
          fetch-depth: 0
          clean: true

      - name: Expor somente no localhost o helper privado para E2E
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('produtor/index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'function encerrarSessaoServidorSilencioso(\n'
          if s.count(marker) != 1:
              raise SystemExit('ENCERRAR_MARKER_COUNT=' + str(s.count(marker)))
          hook = """/* E2E local: nunca exposto no dominio oficial. */\nif(\nwindow.location.hostname ===\n'127.0.0.1' ||\nwindow.location.hostname ===\n'localhost'\n){\nwindow.chamarLoginFirebaseServidor =\nchamarLoginFirebaseServidor;\n}\n\n"""
          if 'window.chamarLoginFirebaseServidor =' in s:
              raise SystemExit('HOOK_JA_EXISTE')
          pos = s.index(marker)
          s = s[:pos] + hook + s[pos:]
          p.write_text(s, encoding='utf-8', newline='')
          PY
          git diff --check
          test "$(git diff --name-only)" = "produtor/index.html"

      - name: Commitar e limpar workflow temporario
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'tudoparasuafestape-dot'
          git config user.email 'tudoparasuafestape@gmail.com'
          rm -f .github/workflows/ct-t1-local-test-hook.yml
          git add -A
          git diff --cached --check
          git commit -m 'test: permitir validar T1 somente no localhost'
          git push origin HEAD:hotfix/portal-login-t1-timeout
