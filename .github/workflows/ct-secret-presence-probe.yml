name: CT Secret Presence Probe

on:
  pull_request:
    paths:
      - '.github/workflows/ct-secret-presence-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
    steps:
      - name: Verify secret presence only
        shell: bash
        run: |
          if [ -n "$CLASPRC_JSON" ]; then
            echo "CLASPRC_PRESENT"
            exit 0
          fi
          echo "CLASPRC_ABSENT"
          exit 91
