name: CT PREPROD - Evento Privado E2E

on:
  push:
    branches:
      - preprod/reunioes-produtores-20260928
    paths:
      - 'tests/e2e/private-event-journey.spec.js'
      - '.github/workflows/ct-preprod-private-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-chromium, mobile-chromium]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar Playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Subir branch local
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/ct-private-http.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ct-private-http.log
          exit 1
      - name: Validar jornada privada
        env:
          CT_BASE_URL: http://127.0.0.1:4173
          CT_EXPECTED_HOST: 127.0.0.1
          CT_BRANCH_MODE: '1'
        run: npx playwright test tests/e2e/private-event-journey.spec.js --project=${{ matrix.project }} --retries=0
