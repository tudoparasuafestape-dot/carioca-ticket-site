name: CT P0 T2 watchdog apply

on:
  workflow_dispatch:
  push:
    branches:
      - perf/p0-portal-login-hotpath
    paths:
      - '.github/workflows/ct-p0-t2-watchdog-apply.yml'

permissions:
  contents: write

defaults:
  run:
    shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"

jobs:
  apply-test-push:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@v4
        with:
          ref: perf/p0-portal-login-hotpath
          fetch-depth: 0
          clean: true

      - name: Runner and Barrier 1
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "RUNNER_NAME=$env:RUNNER_NAME"
          Write-Host "RUNNER_OS=$env:RUNNER_OS"
          Write-Host "RUNNER_ARCH=$env:RUNNER_ARCH"
          $head=(git rev-parse HEAD).Trim(); $parent=(git rev-parse HEAD^1).Trim()
          Write-Host "HEAD=$head"; Write-Host "PARENT=$parent"
          if($head -ne '${{ github.sha }}'){ throw 'HEAD diverge de github.sha' }
          if($parent -ne '7429dec0aadfe0780bf2be797e2a3ebb56e787c5'){ throw "Parent inseguro: $parent" }
          $changed=@(git diff --name-only HEAD^1 HEAD)
          $changed | ForEach-Object { Write-Host "WORKFLOW_COMMIT_FILE=$_" }
          if($changed.Count -ne 1 -or $changed[0] -ne '.github/workflows/ct-p0-t2-watchdog-apply.yml'){ throw 'Commit intermediario contem arquivo nao autorizado.' }
          if(@(git status --short).Count -ne 0){ throw 'Working tree nao esta limpo.' }
          Write-Host 'BARRIER_1=PASS'

      - name: Structural atomic edit
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path

          portal_path=Path('produtor/index.html')
          test_path=Path('tests/e2e/authenticated-operational.spec.js')
          portal=portal_path.read_text(encoding='utf-8')
          tests=test_path.read_text(encoding='utf-8')

          def once(text, old, new, label):
              n=text.count(old)
              print(f'ANCHOR_{label}={n}')
              if n != 1:
                  raise SystemExit(f'{label}: expected exactly 1, got {n}')
              return text.replace(old,new,1)

          # Todas as ancoras sao validadas em memoria; nenhum arquivo e escrito antes do fim.
          for helper in ['function cancelarWatchdogRestauracao(){','function invalidarTentativaRestauracao(){','function tentativaRestauracaoAtiva(','function mostrarFalhaTransitoriaRestauracao(']:
              if portal.count(helper) != 0:
                  raise SystemExit(f'helper preexistente inesperado: {helper}')

          portal=once(portal,"var BOOTSTRAP_TTL_MS =\n600000;\n\nvar state = {","var BOOTSTRAP_TTL_MS =\n600000;\n\nvar RESTORE_UX_TIMEOUT_MS =\n9000;\n\nvar state = {",'timeout')
          portal=once(portal,"contextoPendente:\nfalse,\n\nusuario:","contextoPendente:\nfalse,\n\nrestoreGeneration:\n0,\n\nrestoreTimer:\nnull,\n\nusuario:",'state')
          portal=once(portal,"function(){\n\nif(\nstate.eventoAtual\n){\n\ncarregarPainel(\ntrue\n);","function(){\n\nif(\nstate.contextoPendente ===\ntrue &&\nstate.token\n){\n\ncarregarContextoPortalPendente();\n\nreturn;\n}\n\nif(\nstate.eventoAtual\n){\n\ncarregarPainel(\ntrue\n);",'retry')

          start='function carregarContextoPortalPendente(){'
          end='function abrirPortal(){'
          if portal.count(start)!=1 or portal.count(end)!=1:
              raise SystemExit(f'function markers invalid: start={portal.count(start)} end={portal.count(end)}')
          a=portal.index(start); b=portal.index(end)
          if b<=a: raise SystemExit('function marker order invalid')

          block=r'''function cancelarWatchdogRestauracao(){

if(
state.restoreTimer
){

clearTimeout(
state.restoreTimer
);

state.restoreTimer =
null;
}
}

function invalidarTentativaRestauracao(){

cancelarWatchdogRestauracao();

state.restoreGeneration++;
}

function tentativaRestauracaoAtiva(
generation,
tokenEsperado
){

if(
generation !==
state.restoreGeneration ||
state.contextoPendente !==
true ||
String(
state.token ||
''
)
.trim() !==
tokenEsperado
){

return false;
}

var salvo =
lerSessao();

return Boolean(
salvo &&
String(
salvo.token ||
''
)
.trim() ===
tokenEsperado
);
}

function mostrarFalhaTransitoriaRestauracao(
generation,
tokenEsperado,
erro
){

if(
!tentativaRestauracaoAtiva(
generation,
tokenEsperado
)
){

return;
}

invalidarTentativaRestauracao();

if(
erro
){

registrarErroTecnico(
'Portal | abertura pós-login',
erro
);
}

state.usuario =
null;

state.produtores =
[];

state.produtorAtual =
null;

state.eventoAtual =
null;

abrirShellPortalPendente();

el.refreshButton.disabled =
false;

el.refreshButton.textContent =
'Tentar novamente';

mostrarMensagem(
el.portalMessage,
'Seu login foi realizado, mas não foi possível carregar toda a área administrativa. Sua sessão foi preservada; tente novamente.',
'error'
);
}

function carregarContextoPortalPendente(){

var tokenEsperado =
String(
state.token ||
''
)
.trim();

if(
!tokenEsperado
){

mostrarLogin();

return;
}

invalidarTentativaRestauracao();

var generation =
state.restoreGeneration;

abrirShellPortalPendente();

el.refreshButton.disabled =
true;

el.refreshButton.textContent =
'Carregando...';

state.restoreTimer =
setTimeout(
function(){

mostrarFalhaTransitoriaRestauracao(
generation,
tokenEsperado,
null
);
},
RESTORE_UX_TIMEOUT_MS
);

google.script.run
.withSuccessHandler(
function(r){

if(
!tentativaRestauracaoAtiva(
generation,
tokenEsperado
)
){

return;
}

cancelarWatchdogRestauracao();

if(
r &&
r.autenticado ===
false
){

invalidarTentativaRestauracao();

limparSessaoLocal();

state.token =
'';

state.contextoPendente =
false;

state.usuario =
null;

state.produtores =
[];

state.produtorAtual =
null;

state.eventoAtual =
null;

mostrarLogin();

mostrarMensagem(
el.loginMessage,
'Sua sessão expirou. Faça login novamente.',
'error'
);

return;
}

if(
!r ||
r.sucesso !==
true ||
r.autenticado !==
true
){

mostrarFalhaTransitoriaRestauracao(
generation,
tokenEsperado,
new Error('CT_PORTAL_RESTAURACAO_RESPOSTA_TECNICA_INVALIDA')
);

return;
}

if(
r.autorizado !==
true
){

invalidarTentativaRestauracao();

window.location.replace(
'/produtor/solicitar/'
);

return;
}

var produtoresAutorizados =
Array.isArray(
r.produtores
)
? r.produtores
: [];

if(
!produtoresAutorizados.length
){

invalidarTentativaRestauracao();

window.location.replace(
'/produtor/solicitar/'
);

return;
}

invalidarTentativaRestauracao();

state.usuario =
r.usuario ||
null;

state.produtores =
produtoresAutorizados;

abrirPortal();
}
)
.withFailureHandler(
function(erro){

mostrarFalhaTransitoriaRestauracao(
generation,
tokenEsperado,
erro
);
}
)
.ctPortalProdutorRestaurarSessaoIsoladaPROD(
tokenEsperado
);
}

'''
          portal=portal[:a]+block+portal[b:]

          portal=once(portal,"function abrirPortal(){\n\nstate.contextoPendente =\nfalse;","function abrirPortal(){\n\nstate.contextoPendente =\nfalse;\n\ncancelarWatchdogRestauracao();\n\nel.refreshButton.textContent =\n'Atualizar painel';",'abrirPortal')
          portal=once(portal,"function executarLogout(){\n\nvar tokenAtual =\nstate.token;","function executarLogout(){\n\nvar tokenAtual =\nstate.token;\n\ninvalidarTentativaRestauracao();",'logout')
          portal=once(portal,"function resetarEstado(){\n\nstate.token =","function resetarEstado(){\n\ninvalidarTentativaRestauracao();\n\nstate.token =",'reset')

          # Mock de restore: suporte a delays/respostas por tentativa.
          old_mock="""          case 'ctPortalProdutorRestaurarSessaoIsoladaPROD':\n            expect(String(args[0] || '')).toBe(state.token);\n            resultado = portalSession();\n            break;"""
          new_mock="""          case 'ctPortalProdutorRestaurarSessaoIsoladaPROD':\n            expect(String(args[0] || '')).toBe(state.token);\n            state.restoreCalls = Number(state.restoreCalls || 0) + 1;\n            {\n              const indice = state.restoreCalls - 1;\n              const delays = Array.isArray(state.restoreDelays) ? state.restoreDelays : [];\n              const delay = Number(delays[indice] !== undefined ? delays[indice] : (state.restoreDelayMs || 0));\n              if (delay > 0) await new Promise(resolve => setTimeout(resolve, delay));\n              const respostas = Array.isArray(state.restoreResponses) ? state.restoreResponses : [];\n              resultado = respostas[indice] !== undefined ? respostas[indice] : portalSession();\n            }\n            break;"""
          tests=once(tests,old_mock,new_mock,'mock')

          test_start="  test('Portal preserva sessao local quando restauracao falha transitoriamente'"
          test_end="  test('Central -> Usuarios e Permissoes -> Sair sem rota escondida'"
          if tests.count(test_start)!=1 or tests.count(test_end)!=1:
              raise SystemExit(f'test markers invalid: start={tests.count(test_start)} end={tests.count(test_end)}')
          ta=tests.index(test_start); tb=tests.index(test_end)
          if tb<=ta: raise SystemExit('test marker order invalid')
          test_block=r'''  test('Portal preserva sessao local quando restauracao falha transitoriamente', async ({ page }) => {
    const token = 'CT-E2E-TOKEN-RESTORE-TRANSIENT';
    await page.addInitScript(({ key, value }) => {
      localStorage.setItem(key, JSON.stringify(value));
      sessionStorage.setItem(key, JSON.stringify(value));
    }, { key: STORAGE, value: { token, expiraEm: '2099-12-31T23:59:59.000Z' } });
    await page.route('**/*', async route => {
      if (route.request().method() === 'POST' && (route.request().postData() || '').includes('ctPortalProdutorRestaurarSessaoIsoladaPROD')) {
        await route.abort('failed'); return;
      }
      await route.continue();
    });
    const inicio = Date.now();
    await page.goto('/produtor/', { waitUntil: 'domcontentloaded' });
    await expect(page.locator('#portalMessage')).toContainText('Sua sessão foi preservada', { timeout: 10000 });
    expect(Date.now() - inicio).toBeLessThan(10000);
    await expect(page.locator('#refreshButton')).toHaveText('Tentar novamente');
    await expect(page.locator('#eventPickerButton')).toBeDisabled();
    await expect(page.locator('#centralMobileLink')).toHaveClass(/hidden/);
    const stored = await page.evaluate(key => ({ local: localStorage.getItem(key), session: sessionStorage.getItem(key) }), STORAGE);
    expect(JSON.parse(stored.local).token).toBe(token);
    expect(JSON.parse(stored.session).token).toBe(token);
  });

  test('Portal encerra loading T2 entre 8,5s e 10s quando RPC fica pendurado', async ({ page }) => {
    const state = { token: 'CT-E2E-TOKEN-RESTORE-HANG', restoreDelayMs: 30000, transactionCalls: 0, barMutationCalls: 0, eventMutationCalls: 0, supplierMutationCalls: 0, commissionMutationCalls: 0 };
    await installMock(page, state); await seedSession(page, state.token);
    const inicio = Date.now();
    await page.goto('/produtor/', { waitUntil: 'domcontentloaded' });
    await expect(page.locator('#portalMessage')).toContainText('Sua sessão foi preservada', { timeout: 10000 });
    const elapsed = Date.now() - inicio;
    console.log(`WATCHDOG_ELAPSED_MS=${elapsed}`);
    expect(elapsed).toBeGreaterThanOrEqual(8500);
    expect(elapsed).toBeLessThan(10000);
    await expect(page.locator('#refreshButton')).toHaveText('Tentar novamente');
    await expect(page.locator('#eventPickerButton')).toBeDisabled();
  });

  test('Portal retry bem sucedido invalida callback tardio da tentativa anterior', async ({ page }) => {
    const invalida = { sucesso: false, autenticado: false, autorizado: false };
    const state = { token: 'CT-E2E-TOKEN-RESTORE-RETRY', restoreDelays: [11000,0], restoreResponses: [invalida,portalSession()], transactionCalls: 0, barMutationCalls: 0, eventMutationCalls: 0, supplierMutationCalls: 0, commissionMutationCalls: 0 };
    await installMock(page,state); await seedSession(page,state.token);
    await page.goto('/produtor/', { waitUntil: 'domcontentloaded' });
    await expect(page.locator('#refreshButton')).toHaveText('Tentar novamente',{timeout:10000});
    await page.locator('#refreshButton').click();
    await expect(page.locator('#helloName')).toContainText('Operador Homologacao',{timeout:5000});
    await expect(page.locator('#eventPickerButton')).toBeEnabled();
    await page.waitForTimeout(2500);
    await expect(page.locator('#loginView')).toHaveClass(/hidden/);
    await expect(page.locator('#helloName')).toContainText('Operador Homologacao');
    expect(state.restoreCalls).toBe(2);
  });

  test('Portal logout durante restore impede callback tardio de reabrir Portal', async ({ page }) => {
    const state = { token: 'CT-E2E-TOKEN-RESTORE-LOGOUT', restoreDelayMs: 11000, transactionCalls: 0, barMutationCalls: 0, eventMutationCalls: 0, supplierMutationCalls: 0, commissionMutationCalls: 0 };
    await installMock(page,state); await seedSession(page,state.token);
    await page.goto('/produtor/', { waitUntil: 'domcontentloaded' });
    await expect(page.locator('#portalView')).toBeVisible({timeout:3000});
    await page.locator('#logoutButton').click();
    await expect(page.locator('#loginView')).toBeVisible();
    await page.waitForTimeout(11500);
    await expect(page.locator('#portalView')).toHaveClass(/hidden/);
    const stored=await page.evaluate(key=>({local:localStorage.getItem(key),session:sessionStorage.getItem(key)}),STORAGE);
    expect(stored.local).toBeNull(); expect(stored.session).toBeNull();
  });

  test('Portal restaura normalmente antes do watchdog T2', async ({ page }) => {
    const state = { token: 'CT-E2E-TOKEN-RESTORE-FAST', restoreDelayMs: 100, transactionCalls: 0, barMutationCalls: 0, eventMutationCalls: 0, supplierMutationCalls: 0, commissionMutationCalls: 0 };
    await installMock(page,state); await seedSession(page,state.token);
    const inicio=Date.now();
    await page.goto('/produtor/', { waitUntil: 'domcontentloaded' });
    await expect(page.locator('#helloName')).toContainText('Operador Homologacao',{timeout:5000});
    expect(Date.now()-inicio).toBeLessThan(9000);
    await expect(page.locator('#eventPickerButton')).toBeEnabled();
    await expect(page.locator('#refreshButton')).toHaveText('Atualizar painel');
  });

  test('Portal sessao explicitamente invalida limpa storage e volta ao login', async ({ page }) => {
    const state = { token: 'CT-E2E-TOKEN-INVALID', restoreResponses: [{sucesso:false,autenticado:false,autorizado:false}], transactionCalls:0, barMutationCalls:0, eventMutationCalls:0, supplierMutationCalls:0, commissionMutationCalls:0 };
    await installMock(page,state); await seedSession(page,state.token);
    await page.goto('/produtor/', {waitUntil:'domcontentloaded'});
    await expect(page.locator('#loginView')).toBeVisible({timeout:5000});
    await expect(page.locator('#loginMessage')).toContainText('Sua sessão expirou');
    const stored=await page.evaluate(key=>({local:localStorage.getItem(key),session:sessionStorage.getItem(key)}),STORAGE);
    expect(stored.local).toBeNull(); expect(stored.session).toBeNull();
  });

  test('Portal F5 com sessao valida restaura contexto', async ({ page }) => {
    const state={token:'CT-E2E-TOKEN-F5-VALID',transactionCalls:0,barMutationCalls:0,eventMutationCalls:0,supplierMutationCalls:0,commissionMutationCalls:0};
    await installMock(page,state); await seedSession(page,state.token);
    await page.goto('/produtor/',{waitUntil:'domcontentloaded'});
    await expect(page.locator('#helloName')).toContainText('Operador Homologacao',{timeout:5000});
    await page.reload({waitUntil:'domcontentloaded'});
    await expect(page.locator('#helloName')).toContainText('Operador Homologacao',{timeout:5000});
    await expect(page.locator('#eventPickerButton')).toBeEnabled();
  });

  test('Portal F5 apos logout nao ressuscita sessao', async ({ page }) => {
    const state={token:'CT-E2E-TOKEN-F5-LOGOUT',transactionCalls:0,barMutationCalls:0,eventMutationCalls:0,supplierMutationCalls:0,commissionMutationCalls:0};
    await installMock(page,state); await seedSession(page,state.token);
    await page.goto('/produtor/',{waitUntil:'domcontentloaded'});
    await expect(page.locator('#helloName')).toContainText('Operador Homologacao',{timeout:5000});
    await page.locator('#logoutButton').click();
    await expect(page.locator('#loginView')).toBeVisible();
    await page.reload({waitUntil:'domcontentloaded'});
    await expect(page.locator('#loginView')).toBeVisible();
    await expect(page.locator('#portalView')).toHaveClass(/hidden/);
  });

'''
          tests=tests[:ta]+test_block+tests[tb:]

          # Validacao final em memoria antes da escrita atomica dos dois arquivos.
          required=['RESTORE_UX_TIMEOUT_MS','function cancelarWatchdogRestauracao(){','function carregarContextoPortalPendente(){',"'Tentar novamente'",'invalidarTentativaRestauracao();']
          for marker in required:
              if marker not in portal: raise SystemExit(f'marker final ausente: {marker}')
          if tests.count('WATCHDOG_ELAPSED_MS=') != 1: raise SystemExit('watchdog metric marker invalid')

          portal_path.write_text(portal,encoding='utf-8',newline='')
          test_path.write_text(tests,encoding='utf-8',newline='')
          print('STRUCTURAL_EDIT=PASS')
          '@ | Set-Content -Path .ct_t2_edit.py -Encoding UTF8
          python .ct_t2_edit.py
          $rc=$LASTEXITCODE
          Remove-Item .ct_t2_edit.py -Force -ErrorAction SilentlyContinue
          if($rc -ne 0){ throw "Structural editor failed: $rc" }

      - name: Diff barrier and audit
        run: |
          $ErrorActionPreference='Stop'
          git diff --check
          if($LASTEXITCODE -ne 0){ throw 'git diff --check falhou' }
          Write-Host 'GIT_DIFF_CHECK=PASS'
          git diff --stat
          $changed=@(git diff --name-only)
          $changed | ForEach-Object { Write-Host "CHANGED_FILE=$_" }
          $allowed=@('produtor/index.html','tests/e2e/authenticated-operational.spec.js')
          if($changed.Count -ne 2){ throw 'Quantidade de arquivos alterados invalida' }
          foreach($f in $changed){ if($allowed -notcontains $f){ throw "Arquivo fora do escopo: $f" } }
          git diff -- produtor/index.html
          git diff -- tests/e2e/authenticated-operational.spec.js

      - name: Install frontend dependencies
        run: npm.cmd ci

      - name: Critical transient restore test desktop
        run: npx.cmd playwright test tests/e2e/authenticated-operational.spec.js --project=desktop-chromium --grep "Portal preserva sessao local quando restauracao falha transitoriamente" --workers=1 --retries=0

      - name: Watchdog focused scenarios desktop
        run: npx.cmd playwright test tests/e2e/authenticated-operational.spec.js --project=desktop-chromium --grep "Portal (encerra loading T2|retry bem sucedido|logout durante restore|restaura normalmente antes do watchdog|sessao explicitamente invalida|F5 com sessao valida|F5 apos logout)" --workers=1 --retries=0

      - name: Authenticated operational desktop
        run: npx.cmd playwright test tests/e2e/authenticated-operational.spec.js --project=desktop-chromium --workers=1 --retries=0

      - name: Authenticated operational mobile
        run: npx.cmd playwright test tests/e2e/authenticated-operational.spec.js --project=mobile-chromium --workers=1 --retries=0

      - name: Relevant contracts
        run: |
          $ErrorActionPreference='Stop'
          node tests/contracts.mjs
          node tests/journey-contracts.mjs
          node tests/full-surface-audit.mjs
          if(Test-Path 'tests/producer-portal-performance.contract.mjs'){ node tests/producer-portal-performance.contract.mjs }
          npm.cmd run test:contracts

      - name: Final barrier commit and push
        run: |
          $ErrorActionPreference='Stop'
          git diff --check
          $changed=@(git diff --name-only)
          $allowed=@('produtor/index.html','tests/e2e/authenticated-operational.spec.js')
          if($changed.Count -ne 2){ throw 'Delta final invalido' }
          foreach($f in $changed){ if($allowed -notcontains $f){ throw "Delta final fora do escopo: $f" } }
          git status --short
          git diff --stat
          git add produtor/index.html tests/e2e/authenticated-operational.spec.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: limitar espera T2 do Portal e ignorar callbacks tardios'
