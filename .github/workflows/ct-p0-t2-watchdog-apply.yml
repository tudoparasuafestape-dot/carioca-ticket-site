name: CT P0 T2 watchdog apply

on:
  workflow_dispatch:
  push:
    branches:
      - perf/p0-portal-login-hotpath
    paths:
      - '.github/workflows/ct-p0-t2-watchdog-apply.yml'

permissions:
  contents: write

defaults:
  run:
    shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"

jobs:
  apply-test-push:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@v4
        with:
          ref: perf/p0-portal-login-hotpath
          fetch-depth: 0
          clean: true

      - name: Runner and adjusted Barrier 1
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "RUNNER_NAME=$env:RUNNER_NAME"
          Write-Host "RUNNER_OS=$env:RUNNER_OS"
          Write-Host "RUNNER_ARCH=$env:RUNNER_ARCH"
          Write-Host "github.sha=${{ github.sha }}"
          $head = (git rev-parse HEAD).Trim()
          $parent = (git rev-parse HEAD^1).Trim()
          Write-Host "HEAD=$head"
          Write-Host "PARENT=$parent"
          if ($head -ne '${{ github.sha }}') { throw "HEAD diverge de github.sha" }
          if ($parent -ne 'feafceffa34a173e2b9bf108f5c039d25e36a158') { throw "Parent inseguro: $parent" }
          $changed = @(git diff --name-only HEAD^1 HEAD)
          $changed | ForEach-Object { Write-Host "WORKFLOW_COMMIT_FILE=$_" }
          if ($changed.Count -ne 1 -or $changed[0] -ne '.github/workflows/ct-p0-t2-watchdog-apply.yml') { throw 'Commit intermediario contem arquivo nao autorizado.' }
          git log --oneline -4
          $status = @(git status --short)
          if ($status.Count -ne 0) { $status | Write-Host; throw 'Working tree nao esta limpo.' }

      - name: Patch integrity and apply check
        run: |
          $ErrorActionPreference = 'Stop'
          $patch = 'ops/patches/ct-p0-t2-watchdog.patch'
          $hash = (Get-FileHash $patch -Algorithm SHA256).Hash
          Write-Host "PATCH_SHA256=$hash"
          if ($hash -ne 'DC0FF51EE589F8F357B536914C7FE5A1FFCB9A4C267EE014936E59004A1F5C65') { throw 'SHA256 do patch diverge.' }
          $headers = Get-Content $patch | Where-Object { $_ -match '^(diff --git|--- a/|\+\+\+ b/)' }
          $headers | ForEach-Object { Write-Host $_ }
          $diffTargets = @(Get-Content $patch | Where-Object { $_ -match '^diff --git ' })
          if ($diffTargets.Count -ne 2) { throw 'Patch nao contem exatamente dois alvos.' }
          if ($diffTargets[0] -ne 'diff --git a/produtor/index.html b/produtor/index.html') { throw 'Primeiro alvo inesperado.' }
          if ($diffTargets[1] -ne 'diff --git a/tests/e2e/authenticated-operational.spec.js b/tests/e2e/authenticated-operational.spec.js') { throw 'Segundo alvo inesperado.' }
          git apply --check $patch
          if ($LASTEXITCODE -ne 0) { throw 'git apply --check falhou.' }
          Write-Host 'GIT_APPLY_CHECK=PASS'

      - name: Apply patch and diff barriers
        run: |
          $ErrorActionPreference = 'Stop'
          $patch = 'ops/patches/ct-p0-t2-watchdog.patch'
          git apply $patch
          if ($LASTEXITCODE -ne 0) { throw 'git apply falhou.' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check falhou.' }
          Write-Host 'GIT_DIFF_CHECK=PASS'
          git diff --stat
          git status --short
          $changed = @(git diff --name-only)
          $changed | ForEach-Object { Write-Host "PATCH_CHANGED_FILE=$_" }
          $allowed = @('produtor/index.html','tests/e2e/authenticated-operational.spec.js')
          if ($changed.Count -ne 2) { throw 'Patch alterou quantidade inesperada de arquivos.' }
          foreach ($file in $changed) { if ($allowed -notcontains $file) { throw "Arquivo nao autorizado: $file" } }
          git diff -- produtor/index.html
          git diff -- tests/e2e/authenticated-operational.spec.js

      - name: Install frontend dependencies
        run: |
          $ErrorActionPreference = 'Stop'
          npm.cmd ci

      - name: Critical transient restore test desktop
        run: |
          $ErrorActionPreference = 'Stop'
          npx.cmd playwright test tests/e2e/authenticated-operational.spec.js --project=desktop-chromium --grep "Portal preserva sessao local quando restauracao falha transitoriamente" --workers=1

      - name: Watchdog focused scenarios desktop
        run: |
          $ErrorActionPreference = 'Stop'
          npx.cmd playwright test tests/e2e/authenticated-operational.spec.js --project=desktop-chromium --grep "Portal (encerra loading T2|ignora callback T2 antigo|restaura normalmente antes do watchdog)" --workers=1

      - name: Authenticated operational desktop
        run: |
          $ErrorActionPreference = 'Stop'
          npx.cmd playwright test tests/e2e/authenticated-operational.spec.js --project=desktop-chromium --workers=1

      - name: Authenticated operational mobile
        run: |
          $ErrorActionPreference = 'Stop'
          npx.cmd playwright test tests/e2e/authenticated-operational.spec.js --project=mobile-chromium --workers=1

      - name: Relevant contracts
        run: |
          $ErrorActionPreference = 'Stop'
          node tests/contracts.mjs
          node tests/journey-contracts.mjs
          node tests/full-surface-audit.mjs
          if (Test-Path 'tests/producer-portal-performance.contract.mjs') { node tests/producer-portal-performance.contract.mjs }
          npm.cmd run test:contracts

      - name: Final diff barrier and commit
        run: |
          $ErrorActionPreference = 'Stop'
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check final falhou.' }
          $changed = @(git diff --name-only)
          $allowed = @('produtor/index.html','tests/e2e/authenticated-operational.spec.js')
          if ($changed.Count -ne 2) { throw 'Delta final inesperado.' }
          foreach ($file in $changed) { if ($allowed -notcontains $file) { throw "Delta final nao autorizado: $file" } }
          git status --short
          git diff --stat
          git add produtor/index.html tests/e2e/authenticated-operational.spec.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: limitar espera T2 do Portal e ignorar callbacks tardios'
          $newSha = (git rev-parse HEAD).Trim()
          Write-Host "CORRECTION_SHA=$newSha"
          git push origin HEAD:perf/p0-portal-login-hotpath
