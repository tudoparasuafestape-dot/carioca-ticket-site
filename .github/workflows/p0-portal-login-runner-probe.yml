name: P0 Portal Login Runner Probe

on:
  push:
    branches:
      - perf/p0-portal-login-hotpath

permissions:
  contents: read

jobs:
  probe:
    name: Probe CT-CARIOCA-RUNNER-01
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Confirmar runner
        shell: powershell
        run: |
          Write-Host "RUNNER_NAME=$env:RUNNER_NAME"
          Write-Host "RUNNER_OS=$env:RUNNER_OS"
          Write-Host "RUNNER_ARCH=$env:RUNNER_ARCH"

      - name: Checkout da branch P0 exata
        uses: actions/checkout@v4
        with:
          ref: perf/p0-portal-login-hotpath
          fetch-depth: 1
          persist-credentials: false

      - name: Provar checkout e estado do arquivo
        shell: powershell
        run: |
          git status --short --branch
          $head = git rev-parse HEAD
          Write-Host "HEAD=$head"
          $blob = git rev-parse HEAD:produtor/index.html
          Write-Host "PRODUTOR_INDEX_BLOB=$blob"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath 'produtor/index.html').Hash
          Write-Host "PRODUTOR_INDEX_SHA256=$hash"
          git diff --check
          if (git status --porcelain) {
            throw 'Checkout nao esta limpo.'
          }
