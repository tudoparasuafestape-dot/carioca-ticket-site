name: CT Checkout Commercial Policy Readiness

on:
  pull_request:
    paths:
      - 'assets/checkout-commercial-policy.js'
      - 'assets/fee-*'
      - 'evento/**'
      - 'evento-v2/**'
      - 'tests/fee-transparency.*'
      - 'checkout/**'
      - 'produtor/financeiro/index.html'
      - 'tests/era-finance-summary.runtime.js'
      - 'checkout-v2/**'
      - 'tests/checkout-commercial-policy.runtime.js'
      - 'tests/checkout-era-beauty.dom.js'
      - 'tests/checkout-era-beauty.browser.js'
      - '.github/workflows/ct-checkout-commercial-policy-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  presentation-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Commercial policy presentation runtime
        run: node tests/checkout-commercial-policy.runtime.js
      - name: Price and snapshot display contract
        run: node tests/fee-transparency.runtime.js
      - name: ERA checkout DOM and RPC regression (local mocks only)
        run: node tests/checkout-era-beauty.dom.js
      - name: ERA producer financial summary (local mocks only)
        run: node tests/era-finance-summary.runtime.js
      - name: Prepare browser regression dependencies
        run: |
          npm install --ignore-scripts
          npx playwright install --with-deps chromium
      - name: ERA desktop and mobile browser regression (all network mocked)
        run: node tests/checkout-era-beauty.browser.js
      - name: Fee disclosure at 320, 360, 390 and desktop (all network mocked)
        env:
          CT_EVIDENCE_DIR: fee-evidence
        run: node tests/fee-transparency.browser.js
      - name: Save local preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fee-transparency-screenshots
          path: fee-evidence
      - name: Assert helper stays presentation-only
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'fetch(' assets/checkout-commercial-policy.js
          ! grep -q 'google.script.run' assets/checkout-commercial-policy.js
          ! grep -q 'XMLHttpRequest' assets/checkout-commercial-policy.js

