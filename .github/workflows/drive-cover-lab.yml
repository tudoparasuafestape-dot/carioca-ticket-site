name: Drive cover lab offline review
on:
  pull_request:
    paths:
      - 'review/drive-cover-lab/**'
      - '.github/workflows/drive-cover-lab.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: node --test review/drive-cover-lab/*.test.cjs
      - name: Pinned decoder dependency from official PyPI
        run: |
          python3 -c "import sys; assert sys.version_info[:2] == (3, 12)"
          python3 -m venv /tmp/ct-decoder-venv
          /tmp/ct-decoder-venv/bin/pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r review/drive-cover-lab/decoder-requirements.txt
      - name: Offline decoder regression
        run: cd review/drive-cover-lab && /tmp/ct-decoder-venv/bin/python -m unittest decoder_test -v
# Dependency install reads official PyPI. Tests do not access network.
# No secrets, live probes, artifacts, dispatch, deploy or service writes.
