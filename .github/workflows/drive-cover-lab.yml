name: Drive cover lab offline review
on:
  pull_request:
    paths:
      - 'review/drive-cover-lab/**'
      - '.github/workflows/drive-cover-lab.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: node --test review/drive-cover-lab/*.test.cjs
# No secrets, network probes, artifacts, dispatch, deploy or writes.
