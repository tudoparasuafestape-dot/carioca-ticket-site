name: Temporal catalog lease and pages (offline)
on:
  pull_request:
    paths:
      - 'assets/public-catalog-clock.js'
      - 'evento/**'
      - 'evento-v2/**'
      - 'checkout/**'
      - 'checkout-v2/**'
      - 'tests/public-catalog-clock*'
      - 'tests/temporal-catalog-pages.browser.cjs'
      - 'tests/fixtures/public-canary.cjs'
      - 'tests/safety/isolated-network.cjs'
      - '.github/workflows/public-catalog-clock.yml'
permissions:
  contents: read
jobs:
  lease-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax and synthetic monotonic clock tests
        run: |
          node --check assets/public-catalog-clock.js
          node --test tests/public-catalog-clock.test.cjs
  isolated-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Actual pages, synthetic RPC only, deny all other destinations
        run: |
          node --check tests/temporal-catalog-pages.browser.cjs
          node tests/temporal-catalog-pages.browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: temporal-catalog-offline-pages
          path: test-results/temporal-catalog/
          if-no-files-found: error
