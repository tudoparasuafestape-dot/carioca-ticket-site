name: CT Portal login T1 apply

on:
  push:
    branches:
      - hotfix/portal-login-t1-timeout
    paths:
      - '.github/workflows/ct-portal-login-t1-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/portal-login-t1-timeout
          fetch-depth: 0
          clean: true

      - name: Aplicar T1
        shell: bash
        run: |
          set -euo pipefail
          python3 ops/ct_portal_t1_apply.py
          git diff --check

      - name: Verificar arquivos de produto
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only -- produtor/index.html tests/e2e/authenticated-operational.spec.js | sort)"
          expected=$'produtor/index.html\ntests/e2e/authenticated-operational.spec.js'
          if [ "$changed" != "$expected" ]; then
            echo "Arquivos de produto inesperados:"
            printf '%s\n' "$changed"
            exit 91
          fi

      - name: Commitar hotfix e remover artefatos temporarios
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'tudoparasuafestape-dot'
          git config user.email 'tudoparasuafestape@gmail.com'
          rm -f .github/workflows/ct-portal-login-t1-apply.yml ops/ct_portal_t1_apply.py
          git add -A
          git diff --cached --check
          git commit -m 'fix: limitar espera do login inicial do Portal'
          git push origin HEAD:hotfix/portal-login-t1-timeout
