name: Advertising page review
on:
  pull_request:
    paths:
      - 'anuncie/**'
      - 'assets/advertise.*'
      - 'tests/advertise-*'
      - '.github/workflows/advertise-review.yml'
permissions:
  contents: read
jobs:
  isolated-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/advertise-contract.cjs
      - run: pip install playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/advertise-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: advertising-page-review
          path: test-results/advertise/

