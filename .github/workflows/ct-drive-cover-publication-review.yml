name: Drive cover publication proposal (offline)
on:
  pull_request:
    paths:
      - 'release/drive-cover-lab/**'
      - '.github/workflows/ct-drive-cover-publication-review.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Offline guard and rollback regression
        run: python -m unittest discover -s release/drive-cover-lab -p 'test_*.py' -v
