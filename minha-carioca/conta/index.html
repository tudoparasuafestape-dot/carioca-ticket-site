<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" sizes="192x192" href="/assets/carioca-ticket-icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#090909">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0">
<title>Minha Carioca | Carioca Ticket</title>
<link rel="icon" type="image/png" sizes="192x192" href="/assets/carioca-ticket-icon-192.png">
<style>
:root{--g:#d5a52b;--g2:#f0c85b;--t:#f7f2e8;--m:#aaa59b;--l:#2b2924;--ok:#61d399;--err:#e5a18f}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,rgba(213,165,43,.13),transparent 30%),linear-gradient(180deg,#0a0a0a,#050505 72%);color:var(--t);font-family:Arial,sans-serif}
.wrap{width:min(760px,calc(100% - 28px));margin:auto;padding:28px 0 54px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.top img{width:120px;max-height:54px;object-fit:contain}.back{color:#d5d0c6;text-decoration:none;font-size:13px;font-weight:800}
.card{padding:28px;border:1px solid var(--l);border-radius:26px;background:linear-gradient(180deg,#131313,#0d0d0d);box-shadow:0 24px 80px rgba(0,0,0,.4)}.ey{font-size:11px;font-weight:900;letter-spacing:.18em;color:var(--g2);text-transform:uppercase}
h1{font-size:clamp(38px,8vw,58px);line-height:1.02;letter-spacing:-.045em;margin:12px 0 14px}.lead{color:#c0bbb1;font-size:16px;line-height:1.7;margin:0 0 22px}
label{display:block;margin:0 0 8px;font-size:13px;font-weight:800}input{width:100%;min-height:54px;border:1px solid #39362f;border-radius:13px;background:#090909;color:var(--t);padding:0 15px;outline:none;font-size:16px}input:focus{border-color:rgba(240,200,91,.75);box-shadow:0 0 0 3px rgba(213,165,43,.1)}
.btn{width:100%;min-height:54px;border:1px solid var(--g);border-radius:13px;background:linear-gradient(135deg,var(--g),var(--g2));color:#111;font-weight:900;font-size:16px;margin-top:14px}.help{margin:12px 0 0;color:var(--m);font-size:12px;line-height:1.6}.msg{min-height:22px;margin:12px 0 0;color:var(--err);font-size:12px;line-height:1.55}.msg.ok{color:var(--ok)}
.sec{margin-top:22px;padding:17px;border:1px solid #22303d;border-radius:17px;background:#0d131a}.sec strong{display:block;margin-bottom:5px}.sec p{margin:0;color:#a8b2bd;font-size:12px;line-height:1.6}
.code{text-align:center;font-size:28px;font-weight:900;letter-spacing:.3em;padding-left:.3em}.list{display:grid;gap:12px}.item{padding:18px;border:1px solid #292720;border-radius:18px;background:#0b0b0b}.item h3{margin:7px 0 8px;font-size:19px}.item p{margin:0 0 12px;color:var(--m);font-size:12px;line-height:1.55}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid #25231f;padding-top:13px}.open{display:inline-flex;align-items:center;justify-content:center;min-height:43px;border-radius:11px;background:linear-gradient(135deg,var(--g),var(--g2));color:#111;text-decoration:none;font-size:12px;font-weight:900;padding:0 15px}.logout{border:1px solid #37342f;border-radius:11px;background:#101010;color:#ddd5c8;min-height:42px;padding:0 14px;font-weight:800}
.head{display:flex;justify-content:space-between;gap:18px;align-items:start}.meta{color:var(--m);font-size:12px}.small{color:var(--m);font-size:11px}.empty{padding:24px;border:1px dashed #3c382f;border-radius:17px;text-align:center;color:var(--m);font-size:13px}
.overview{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0 26px}.stat{padding:15px;border:1px solid #2c2922;border-radius:15px;background:#0a0a0a}.stat small{display:block;color:#8e887d;font-size:9px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}.stat strong{font-size:22px;line-height:1}.section-head{display:flex;justify-content:space-between;align-items:end;gap:14px;margin:4px 0 14px}.section-head h2{margin:0;font-size:25px}.section-head p{margin:0;color:var(--m);font-size:11px;line-height:1.45;text-align:right;max-width:310px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.ghost{display:inline-flex;align-items:center;justify-content:center;min-height:43px;border:1px solid #37342f;border-radius:11px;background:#101010;color:#ddd5c8;text-decoration:none;font-size:12px;font-weight:900;padding:0 15px}.purchase-id{display:block;margin-top:4px;color:#6f6a61;font-size:9px;word-break:break-all}
@media(max-width:560px){.card{padding:22px}.back{font-size:11px}.head{display:grid}.overview{grid-template-columns:1fr}.section-head{display:block}.section-head p{text-align:left;margin-top:6px}.row{align-items:flex-end}}
</style>
  <script src="/pwa-register.js" defer></script>
</head>
<body>
<div class="wrap">
<div class="top"><a href="/"><img src="/assets/carioca-ticket-logo.png" alt="Carioca Ticket"></a><a class="back" href="/">← Voltar aos eventos</a></div>
<main id="app" class="card"></main>
</div>
<script>
(function(){
'use strict';
var APP='https://script.google.com/macros/s/AKfycbz28keO65PIIElB8dWMBt8nnEBw9CzBxWnc6nOhAKKGNDkMZnYbWjrhTtr_v-lEI2IAJA/exec';
var STORE='ct_mc_account_v6',REQ='ct_mc_req_v6',ID='ct_mc_id_v6',PURCHASE_STORE='CT_MINHA_CARIOCA_COMPRAS_V1',RECOVERY_PREFIX='CT_CHECKOUT_RECOVERY_',app=document.getElementById('app');

function e(tag,cls,text){var n=document.createElement(tag);if(cls)n.className=cls;if(text!=null)n.textContent=String(text);return n}
var pendingPosts={};
function post(action,data){
var id='MCWEB-'+(window.crypto&&crypto.randomUUID?crypto.randomUUID():String(Date.now())+'-'+Math.random().toString(36).slice(2));
var frameName='ctmc_post_'+id.replace(/[^A-Za-z0-9_]/g,'');
var frame=document.createElement('iframe');frame.name=frameName;frame.style.display='none';frame.setAttribute('aria-hidden','true');
var f=document.createElement('form');f.method='POST';f.action=APP;f.target=frameName;f.style.display='none';
function add(k,v){var i=document.createElement('input');i.type='hidden';i.name=k;i.value=String(v==null?'':v);f.appendChild(i)}
add('ctMinhaCariocaAction',action);add('ctMinhaCariocaRequestId',id);Object.keys(data||{}).forEach(function(k){add(k,data[k])});
document.body.append(frame,f);pendingPosts[id]={action:action,frame:frame,form:f};
pendingPosts[id].timer=setTimeout(function(){var p=pendingPosts[id];if(!p)return;delete pendingPosts[id];try{p.form.remove();p.frame.remove()}catch(_){}
if(action==='solicitarCodigo')login('O envio demorou mais que o esperado. Tente novamente.');
else if(action==='validarCodigo')otp(sessionStorage.getItem(REQ)||'','A validação demorou mais que o esperado. Tente novamente.');
},20000);
f.submit()
}
window.addEventListener('message',function(ev){
if(ev.origin!=='https://script.google.com' && !/\.googleusercontent\.com$/.test(ev.origin||''))return;
var p=ev.data;if(!p||p.ctMinhaCariocaPost!==true||!p.id||!pendingPosts[p.id])return;
var ctx=pendingPosts[p.id];delete pendingPosts[p.id];clearTimeout(ctx.timer);try{ctx.form.remove();ctx.frame.remove()}catch(_){}
if(ctx.action==='solicitarCodigo'){
if(p.ok&&p.resultado&&p.resultado.requestId){var r=p.resultado;sessionStorage.setItem(REQ,r.requestId);otp(r.requestId,r.mensagem||'Confira o canal seguro da sua conta.');return}
login(p.erro||'Não foi possível enviar o código.');return
}
if(ctx.action==='validarCodigo'){
var v=p.resultado||{};if(p.ok&&v.autenticado&&v.token){save(v);sessionStorage.removeItem(REQ);sessionStorage.removeItem(ID);account(v,'Acesso confirmado com segurança.');return}
otp(sessionStorage.getItem(REQ)||'',v.mensagem||p.erro||'Código inválido ou expirado.');return
}
if(ctx.action==='consultarSessao'){
var s=p.resultado||{};if(p.ok&&s.autenticado&&s.token){save(s);account(s,'');return}
localStorage.removeItem(STORE);login('Sua sessão expirou. Entre novamente.');return
}
if(ctx.action==='logout'){
localStorage.removeItem(STORE);sessionStorage.clear();login('Sessão encerrada.');return
}
});
function decode(raw){var s=String(raw||'').replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return JSON.parse(new TextDecoder('utf-8').decode(u))}
function clearHash(){if(location.hash)history.replaceState(null,'',location.pathname+location.search)}
function save(data){var token=String(data&&data.token||'').trim();if(!token){localStorage.removeItem(STORE);return}localStorage.setItem(STORE,JSON.stringify({exp:Date.now()+21600000,token:token}))}
function load(){try{var x=JSON.parse(localStorage.getItem(STORE)||'null');if(!x||Date.now()>x.exp||!x.token){localStorage.removeItem(STORE);return null}return String(x.token)}catch(_){localStorage.removeItem(STORE);return null}}
function restore(token){post('consultarSessao',{token:String(token||'')})}
function base(title,lead){app.innerHTML='';app.append(e('div','ey','Área do cliente'),e('h1','',title),e('p','lead',lead))}
function security(){var s=e('div','sec');s.append(e('strong','','Seus ingressos continuam protegidos'),e('p','','Informar telefone ou e-mail não libera ingressos. O acesso só acontece depois da confirmação do código recebido.'));app.append(s)}

function comprasSegurasDoAparelho(){
var out=[],seen={};
function add(item){
  item=item||{};
  var pedido=String(item.pedidoId||'').trim(),token=String(item.token||'').trim();
  if(!pedido||!token||seen[pedido])return;
  seen[pedido]=true;
  out.push({pedidoId:pedido,token:token,eventoNome:String(item.eventoNome||'').trim(),atualizadoEm:String(item.atualizadoEm||'').trim()});
}
try{
  var list=JSON.parse(localStorage.getItem(PURCHASE_STORE)||'[]');
  if(Array.isArray(list))list.forEach(add);
}catch(_){}
try{
  for(var i=0;i<localStorage.length;i++){
    var key=String(localStorage.key(i)||'');
    if(key.indexOf(RECOVERY_PREFIX)!==0)continue;
    try{add(JSON.parse(localStorage.getItem(key)||'null'))}catch(_){}
  }
}catch(_){}
return out.slice(0,5);
}

function deviceRecovery(){
var compras=comprasSegurasDoAparelho();
if(!compras.length)return;
var box=e('div','sec');
box.append(
  e('strong','','Compra segura encontrada neste aparelho'),
  e('p','','Você pode abrir os ingressos salvos neste navegador sem esperar pelo código de e-mail ou WhatsApp.')
);
compras.forEach(function(item,idx){
  var row=e('div','row'),info=e('div');
  info.append(e('span','small',item.eventoNome||('Compra recente '+(idx+1))),e('span','purchase-id',item.pedidoId));
  var a=e('a','open','Abrir meus ingressos');
  a.href='/minha-carioca/ingressos/?v=20260923-1940&pedido='+encodeURIComponent(item.pedidoId)+'&token='+encodeURIComponent(item.token);
  row.append(info,a);box.append(row);
});
app.append(box);
}

function login(msg){
base('Minha Carioca','Entre para acessar seus ingressos e compras com segurança.');
var l=e('label','','WhatsApp ou e-mail'),i=document.createElement('input'),b=e('button','btn','Continuar'),h=e('p','help','Use preferencialmente seu WhatsApp. O código será enviado pelo canal seguro disponível na sua conta.'),m=e('p','msg',msg||'');
i.placeholder='Seu e-mail ou WhatsApp cadastrado';i.value=sessionStorage.getItem(ID)||'';b.type='button';app.append(l,i,b,h,m);deviceRecovery();security();
function go(){var v=String(i.value||'').trim();if(!v){m.textContent='Informe seu e-mail ou WhatsApp.';return}sessionStorage.setItem(ID,v);b.disabled=true;b.textContent='Enviando…';post('solicitarCodigo',{identificador:v})}
b.onclick=go;i.onkeydown=function(ev){if(ev.key==='Enter'){ev.preventDefault();go()}};setTimeout(function(){i.focus()},0)
}

function otp(req,msg){
base('Digite o código','Enviamos um código de 6 dígitos pelo canal seguro disponível na sua conta.');
var l=e('label','','Código de acesso'),i=document.createElement('input'),b=e('button','btn','Confirmar código'),m=e('p','msg ok',msg||''),h=e('p','help','O código expira em 5 minutos. Para solicitar outro, volte aos eventos e entre novamente.');
i.className='code';i.inputMode='numeric';i.autocomplete='one-time-code';i.maxLength=6;i.placeholder='000000';b.type='button';app.append(l,i,b,m,h);deviceRecovery();security();
function go(){var v=String(i.value||'').replace(/\D/g,'').slice(0,6);if(v.length!==6){m.className='msg';m.textContent='Digite os 6 números do código.';return}b.disabled=true;b.textContent='Validando…';post('validarCodigo',{requestId:req,codigo:v})}
b.onclick=go;i.oninput=function(){this.value=this.value.replace(/\D/g,'').slice(0,6)};i.onkeydown=function(ev){if(ev.key==='Enter'){ev.preventDefault();go()}};setTimeout(function(){i.focus()},0)
}

function account(data,msg){
app.innerHTML='';
var u=data.usuario||{},arr=Array.isArray(data.compras)?data.compras:[];
var totalIngressos=arr.reduce(function(n,x){return n+(Number(x.quantidade||0)||0)},0);
var grupos={};
arr.forEach(function(x){
  var chave=String(x.eventoId||'')||[x.eventoNome||'',x.data||'',x.local||''].join('|');
  if(!grupos[chave])grupos[chave]={evento:x,itens:[],total:0};
  grupos[chave].itens.push(x);
  grupos[chave].total+=Number(x.quantidade||0)||0;
});
var chaves=Object.keys(grupos);

var head=e('div','head'),left=e('div');
left.append(
  e('div','ey','Conta Carioca'),
  e('h1','',u.nome?('Olá, '+String(u.nome).split(/\s+/)[0]):'Minha Carioca')
);
var meta=[];
if(u.whatsappMascarado)meta.push(u.whatsappMascarado);
if(u.emailMascarado)meta.push(u.emailMascarado);
left.append(e('div','meta',meta.join(' · ')));
var out=e('button','logout','Sair');out.type='button';
head.append(left,out);app.append(head);
if(msg)app.append(e('p','msg ok',msg));

var overview=e('div','overview');
[
  ['Ingressos',totalIngressos],
  ['Eventos',chaves.length],
  ['Compras',arr.length]
].forEach(function(x){
  var card=e('div','stat');
  card.append(e('small','',x[0]),e('strong','',String(x[1])));
  overview.append(card);
});
app.append(overview);

var sec=e('div','section-head'),secLeft=e('div');
secLeft.append(e('h2','','Meus ingressos'));
sec.append(secLeft,e('p','','Seus ingressos digitais ficam reunidos aqui, organizados por evento e compra.'));
app.append(sec);

var list=e('div','list');
if(!arr.length){
  var vazio=e('div','empty','Você ainda não possui compras concluídas nesta conta.');
  list.append(vazio);
}

chaves.forEach(function(chave){
  var g=grupos[chave],x=g.evento||{},it=e('article','item');
  it.append(e('div','ey','Ingresso Carioca Ticket'),e('h3','',x.eventoNome||'Evento Carioca Ticket'));
  var d=[];
  if(x.data)d.push(x.data);
  if(x.horario)d.push(x.horario);
  if(x.local)d.push(x.local);
  if(x.cidade)d.push(x.cidade+(x.uf?' - '+x.uf:''));
  it.append(e('p','',d.join(' · ')));

  var resumo=e('div','row');
  resumo.append(
    e('strong','',g.total+(g.total===1?' ingresso':' ingressos')),
    e('span','small',g.itens.length+(g.itens.length===1?' compra confirmada':' compras confirmadas'))
  );
  it.append(resumo);

  g.itens.forEach(function(pedido,idx){
    var linha=e('div','row');
    var info=e('div');
    var qtd=Number(pedido.quantidade||0)||0;
    info.append(e('span','small','Compra '+(idx+1)+' · '+qtd+(qtd===1?' acesso':' acessos')));
    if(pedido.pedidoId)info.append(e('span','purchase-id',String(pedido.pedidoId)));

    var a=e('a','open',qtd===1?'Abrir ingresso':'Abrir ingressos');
    try{
      var pu=new URL(String(pedido.link||''),location.origin);
      var pp=String(pu.searchParams.get('pedido')||pedido.pedidoId||'').trim();
      var pt=String(pu.searchParams.get('token')||'').trim();
      a.href='/minha-carioca/ingressos/?v=20260921-0530&pedido='+encodeURIComponent(pp)+'&token='+encodeURIComponent(pt);
    }catch(_){
      a.href=String(pedido.link||'#');
    }
    linha.append(info,a);it.append(linha);
  });
  list.append(it);
});
app.append(list);

var toolbar=e('div','toolbar');
var eventos=e('a','ghost','Ver outros eventos');
eventos.href='/?v=20260921-0530#todos-eventos';
toolbar.append(eventos);
app.append(toolbar);

security();

out.onclick=function(){
  var token=String(data&&data.token||'').trim();
  if(token){post('logout',{token:token});return}
  localStorage.removeItem(STORE);sessionStorage.clear();login('Sessão encerrada.')
}
}

if(location.hash.indexOf('#ctmc=')===0){
var env;try{env=decode(location.hash.slice(6))}catch(_){clearHash();login('Não foi possível concluir o retorno seguro.');return}clearHash();
if(env.tipo==='solicitarCodigo'&&env.ok&&env.resultado&&env.resultado.requestId){var r=env.resultado;sessionStorage.setItem(REQ,r.requestId);otp(r.requestId,r.mensagem||'Confira o canal seguro da sua conta.');return}
if(env.tipo==='validarCodigo'){var v=env.resultado||{};if(env.ok&&v.autenticado&&v.token){sessionStorage.removeItem(REQ);sessionStorage.removeItem(ID);restore(v.token);return}otp(sessionStorage.getItem(REQ)||'',v.mensagem||env.erro||'Código inválido ou expirado.');return}
login(env.erro||'Não foi possível concluir o acesso.');return
}
var pending=sessionStorage.getItem(REQ)||'';if(pending){otp(pending,'Digite o código recebido pelo canal seguro da sua conta.');return}
var cached=load();if(cached){restore(cached);return}
login('');
}());
</script>
</body>
</html>
