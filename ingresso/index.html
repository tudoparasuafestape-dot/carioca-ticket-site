<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#090909">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">

  <meta name="description" content="Ingresso Digital oficial Carioca Ticket. Abra para acessar seu QR Code e consultar o status atualizado do ingresso.">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Carioca Ticket">
  <meta property="og:title" content="Carioca Ticket — Ingresso Digital">
  <meta property="og:description" content="Seu ingresso digital oficial. Abra para visualizar o QR Code, os dados do evento e o status atualizado.">
  <meta property="og:url" content="https://cariocaticket.com.br/ingresso/">
  <meta property="og:image" content="https://cariocaticket.com.br/assets/carioca-ticket-preview-oficial-v9.jpg">
  <meta property="og:image:secure_url" content="https://cariocaticket.com.br/assets/carioca-ticket-preview-oficial-v9.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1731">
  <meta property="og:image:height" content="909">
  <meta property="og:image:alt" content="Carioca Ticket — Ingressos e tecnologia para eventos">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Carioca Ticket — Ingresso Digital">
  <meta name="twitter:description" content="Seu ingresso digital oficial Carioca Ticket.">
  <meta name="twitter:image" content="https://cariocaticket.com.br/assets/carioca-ticket-preview-oficial-v9.jpg">

  <link rel="canonical" href="https://cariocaticket.com.br/ingresso/">
  <link rel="icon" type="image/png" href="/assets/carioca-ticket-simbolo.png">

  <title>Carioca Ticket — Ingresso Digital</title>

  <style>
    :root{
      --bg:#070707;
      --panel:#111;
      --gold:#d5a52b;
      --gold2:#f0c85b;
      --text:#f7f2e8;
      --muted:#aaa59b;
      --line:#2a2824;
    }
    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0}
    body{
      display:grid;
      place-items:center;
      padding:24px;
      background:
        radial-gradient(circle at 50% 0,rgba(213,165,43,.13),transparent 34%),
        linear-gradient(180deg,#0c0c0c,var(--bg));
      color:var(--text);
      font-family:Inter,Arial,sans-serif;
    }
    .card{
      width:min(100%,520px);
      padding:34px 28px;
      border:1px solid rgba(213,165,43,.25);
      border-radius:24px;
      background:linear-gradient(160deg,#15130e,var(--panel));
      box-shadow:0 28px 80px rgba(0,0,0,.42);
      text-align:center;
    }
    .logo{
      display:block;
      width:min(260px,78%);
      max-height:92px;
      margin:0 auto 24px;
      object-fit:contain;
    }
    .eyebrow{
      display:block;
      margin-bottom:8px;
      color:var(--gold2);
      font-size:11px;
      font-weight:900;
      letter-spacing:.18em;
      text-transform:uppercase;
    }
    h1{
      margin:0 0 12px;
      font-size:clamp(28px,7vw,40px);
      line-height:1.06;
      letter-spacing:-.04em;
    }
    p{
      margin:0;
      color:var(--muted);
      font-size:14px;
      line-height:1.65;
    }
    .spinner{
      width:42px;
      height:42px;
      margin:26px auto 20px;
      border:4px solid rgba(255,255,255,.11);
      border-top-color:var(--gold2);
      border-radius:50%;
      animation:girar .8s linear infinite;
    }
    @keyframes girar{to{transform:rotate(360deg)}}
    .btn{
      display:none;
      align-items:center;
      justify-content:center;
      width:100%;
      min-height:52px;
      margin-top:24px;
      border-radius:13px;
      background:linear-gradient(135deg,var(--gold),var(--gold2));
      color:#0b0b0b;
      text-decoration:none;
      font-size:14px;
      font-weight:900;
    }
    .erro{
      display:none;
      margin-top:22px;
      padding:14px;
      border:1px solid #4b2929;
      border-radius:13px;
      background:#211313;
      color:#ffd2d2;
      font-size:13px;
      line-height:1.5;
    }
    .rodape{
      margin-top:22px;
      color:#6f6a61;
      font-size:10px;
    }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/assets/carioca-ticket-logo.png" alt="Carioca Ticket">
    <span class="eyebrow">Ingresso oficial</span>
    <h1>Abrindo seu ingresso digital</h1>
    <p id="mensagem">Aguarde alguns instantes. Você será direcionado ao ingresso seguro da Carioca Ticket.</p>

    <div id="spinner" class="spinner" aria-hidden="true"></div>

    <a id="abrir" class="btn" href="#" rel="nofollow">Abrir ingresso</a>
    <div id="erro" class="erro"></div>

    <div class="rodape">Carioca Ticket · acesso seguro ao ingresso digital</div>
  </main>

  <script>
    (function () {
      const BASE_INGRESSO =
        'https://script.google.com/macros/s/AKfycbz28keO65PIIElB8dWMBt8nnEBw9CzBxWnc6nOhAKKGNDkMZnYbWjrhTtr_v-lEI2IAJA/exec';

      const parametros = new URLSearchParams(window.location.search);
      const codigo = String(parametros.get('codigo') || '').trim().toUpperCase();
      const sig = String(parametros.get('sig') || '').trim();

      const codigoValido = /^[A-Z0-9][A-Z0-9-]{5,79}$/.test(codigo);
      const assinaturaValida = /^[A-Za-z0-9_-]{16,128}$/.test(sig);

      const spinner = document.getElementById('spinner');
      const abrir = document.getElementById('abrir');
      const erro = document.getElementById('erro');
      const mensagem = document.getElementById('mensagem');

      if (!codigoValido || !assinaturaValida) {
        spinner.style.display = 'none';
        mensagem.textContent = 'Não foi possível abrir este ingresso.';
        erro.textContent = 'O link está incompleto ou inválido. Solicite novamente o ingresso oficial.';
        erro.style.display = 'block';
        return;
      }

      const destino =
        BASE_INGRESSO +
        '?page=ingresso' +
        '&codigo=' + encodeURIComponent(codigo) +
        '&sig=' + encodeURIComponent(sig) +
        '&pv=6';

      abrir.href = destino;
      abrir.style.display = 'inline-flex';

      window.setTimeout(function () {
        window.location.replace(destino);
      }, 350);
    }());
  </script>
</body>
</html>
