<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#090909">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0">
  <meta name="referrer" content="no-referrer">

  <meta name="description" content="Ingresso Digital oficial Carioca Ticket. Abra para acessar seu QR Code e consultar o status atualizado do ingresso.">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Carioca Ticket">
  <meta property="og:title" content="Carioca Ticket — Ingresso Digital">
  <meta property="og:description" content="Seu ingresso digital oficial. Abra para visualizar o QR Code, os dados do evento e o status atualizado.">
  <meta property="og:url" content="https://cariocaticket.com.br/ingresso/">
  <meta property="og:image" content="https://cariocaticket.com.br/assets/carioca-ticket-preview-oficial-v9.jpg">
  <meta property="og:image:secure_url" content="https://cariocaticket.com.br/assets/carioca-ticket-preview-oficial-v9.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1731">
  <meta property="og:image:height" content="909">
  <meta property="og:image:alt" content="Carioca Ticket — Ingressos e tecnologia para eventos">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Carioca Ticket — Ingresso Digital">
  <meta name="twitter:description" content="Seu ingresso digital oficial Carioca Ticket.">
  <meta name="twitter:image" content="https://cariocaticket.com.br/assets/carioca-ticket-preview-oficial-v9.jpg">

  <link rel="canonical" href="https://cariocaticket.com.br/ingresso/">
  <link rel="icon" type="image/png" href="/assets/carioca-ticket-simbolo.png">

  <title>Carioca Ticket — Ingresso Digital</title>

  <style>
    :root{
      --bg:#070707;
      --panel:#111;
      --gold:#d5a52b;
      --gold2:#f0c85b;
      --text:#f7f2e8;
      --muted:#aaa59b;
      --line:#2a2824;
    }
    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0}
    body{
      display:grid;
      place-items:center;
      padding:24px;
      background:
        radial-gradient(circle at 50% 0,rgba(213,165,43,.13),transparent 34%),
        linear-gradient(180deg,#0c0c0c,var(--bg));
      color:var(--text);
      font-family:Inter,Arial,sans-serif;
    }
    .card{
      width:min(100%,520px);
      padding:34px 28px;
      border:1px solid rgba(213,165,43,.25);
      border-radius:24px;
      background:linear-gradient(160deg,#15130e,var(--panel));
      box-shadow:0 28px 80px rgba(0,0,0,.42);
      text-align:center;
    }
    .logo{
      display:block;
      width:min(260px,78%);
      max-height:92px;
      margin:0 auto 24px;
      object-fit:contain;
    }
    .eyebrow{
      display:block;
      margin-bottom:8px;
      color:var(--gold2);
      font-size:11px;
      font-weight:900;
      letter-spacing:.18em;
      text-transform:uppercase;
    }
    h1{
      margin:0 0 12px;
      font-size:clamp(28px,7vw,40px);
      line-height:1.06;
      letter-spacing:-.04em;
    }
    p{
      margin:0;
      color:var(--muted);
      font-size:14px;
      line-height:1.65;
    }
    .spinner{
      width:42px;
      height:42px;
      margin:26px auto 20px;
      border:4px solid rgba(255,255,255,.11);
      border-top-color:var(--gold2);
      border-radius:50%;
      animation:girar .8s linear infinite;
    }
    @keyframes girar{to{transform:rotate(360deg)}}
    .btn{
      display:none;
      align-items:center;
      justify-content:center;
      width:100%;
      min-height:52px;
      margin-top:24px;
      border-radius:13px;
      background:linear-gradient(135deg,var(--gold),var(--gold2));
      color:#0b0b0b;
      text-decoration:none;
      font-size:14px;
      font-weight:900;
    }
    .ticket-view{display:none;text-align:left}.ticket-view.show{display:block}
    .event-cover{height:170px;margin:-8px -2px 20px;position:relative;overflow:hidden;border-radius:18px;background:#090909}
    .event-cover img{width:100%;height:100%;object-fit:cover;display:block}
    .event-cover:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent,rgba(0,0,0,.72))}
    .event-cover strong{position:absolute;z-index:2;left:16px;right:16px;bottom:15px;color:#fff;font-size:21px;line-height:1.15}
    .status{display:inline-flex;padding:7px 10px;border-radius:999px;background:#10251a;color:#68dfa0;font-size:11px;font-weight:900;margin-bottom:14px}
    .info{display:grid;grid-template-columns:1fr 1fr;gap:9px}.info div{padding:12px;border:1px solid #292720;border-radius:13px;background:#0b0b0b}
    .info small{display:block;color:#817c73;font-size:9px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}
    .info strong{display:block;color:var(--text);font-size:12px;line-height:1.4}
    .qr{width:min(270px,82%);aspect-ratio:1;margin:22px auto 8px;padding:12px;border-radius:18px;background:#fff;display:block;object-fit:contain}
    .code{text-align:center;color:var(--gold2);font-size:15px;font-weight:900;letter-spacing:.08em;word-break:break-all}
    .security-note{margin-top:18px;padding:14px;border:1px solid #213343;border-radius:14px;background:#0c141c;color:#aeb9c4;font-size:11px;line-height:1.55;text-align:left}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:18px}
    .action{min-height:48px;display:flex;align-items:center;justify-content:center;border-radius:13px;text-decoration:none;font-size:12px;font-weight:900;border:1px solid #37342f;color:#ddd5c8;background:#111}
    .action.primary{border-color:var(--gold);background:linear-gradient(135deg,var(--gold),var(--gold2));color:#111}
    .action.whatsapp{border-color:#1f7a46;background:#128c4a;color:#fff}
    button.action{width:100%;font-family:inherit;cursor:pointer}
    .action.full{grid-column:1/-1}
    @media(max-width:520px){.info,.actions{grid-template-columns:1fr}.action.full{grid-column:auto}}
    @page{size:A4 portrait;margin:0}
    @media print{
      html,body{width:210mm;min-height:297mm}
      body{
        display:block;
        padding:10mm 14mm;
        background:#fff!important;
        color:#111;
        -webkit-print-color-adjust:exact;
        print-color-adjust:exact
      }
      .card{
        width:100%;
        max-width:182mm;
        margin:0 auto;
        padding:0;
        border:0;
        box-shadow:none;
        background:#fff!important
      }
      .logo{width:48mm;max-height:20mm;margin:0 auto 6mm}
      .actions,.rodape{display:none!important}
      .ticket-view{color:#111}
      .event-cover{
        height:54mm;
        margin:0 0 6mm;
        border:1px solid #ddd;
        border-radius:5mm;
        overflow:hidden;
        background:#fff!important
      }
      .event-cover img{
        display:block!important;
        visibility:visible!important;
        opacity:1!important;
        width:100%!important;
        height:100%!important;
        object-fit:cover!important;
        -webkit-print-color-adjust:exact;
        print-color-adjust:exact
      }
      .event-cover:after{
        -webkit-print-color-adjust:exact;
        print-color-adjust:exact
      }
      .event-cover strong{font-size:20pt}
      .status{
        -webkit-print-color-adjust:exact;
        print-color-adjust:exact
      }
      .info{gap:3mm}
      .info div{border-color:#ddd;background:#fff}
      .info strong{color:#111}
      .qr{width:66mm;margin:7mm auto 2mm;border:1px solid #ddd}
      .code{font-size:14pt}
      .security-note{margin-top:5mm;border-color:#ccc;background:#fff;color:#333}
    }
    .erro{
      display:none;
      margin-top:22px;
      padding:14px;
      border:1px solid #4b2929;
      border-radius:13px;
      background:#211313;
      color:#ffd2d2;
      font-size:13px;
      line-height:1.5;
    }
    .rodape{
      margin-top:22px;
      color:#6f6a61;
      font-size:10px;
    }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/assets/carioca-ticket-logo.png" alt="Carioca Ticket">
    <span class="eyebrow">Ingresso oficial</span>
    <h1>Abrindo seu ingresso digital</h1>
    <p id="mensagem">Aguarde alguns instantes. Você será direcionado ao ingresso seguro da Carioca Ticket.</p>

    <div id="spinner" class="spinner" aria-hidden="true"></div>

    <a id="abrir" class="btn" href="#" rel="nofollow">Abrir ingresso</a>
    <div id="erro" class="erro"></div>
    <section id="ticket-view" class="ticket-view"></section>

    <div class="rodape">Carioca Ticket · acesso seguro ao ingresso digital</div>
  </main>

  <script>
    (function () {
      'use strict';

      var BASE='https://script.google.com/macros/s/AKfycbz28keO65PIIElB8dWMBt8nnEBw9CzBxWnc6nOhAKKGNDkMZnYbWjrhTtr_v-lEI2IAJA/exec';
      var parametros=new URLSearchParams(window.location.search);
      var codigo=String(parametros.get('codigo')||'').trim().toUpperCase();
      var sig=String(parametros.get('sig')||'').trim();

      var spinner=document.getElementById('spinner');
      var abrir=document.getElementById('abrir');
      var erro=document.getElementById('erro');
      var mensagem=document.getElementById('mensagem');
      var view=document.getElementById('ticket-view');
      var pending={};

      function esc(v){
        return String(v||'')
          .replace(/&/g,'&amp;')
          .replace(/</g,'&lt;')
          .replace(/>/g,'&gt;')
          .replace(/"/g,'&quot;')
          .replace(/'/g,'&#039;');
      }

      function postSecure(data,done){
        var id='ING-'+(window.crypto&&crypto.randomUUID?crypto.randomUUID():String(Date.now())+'-'+Math.random().toString(36).slice(2));
        var frameName='ing_'+id.replace(/[^A-Za-z0-9_]/g,'');
        var frame=document.createElement('iframe');frame.name=frameName;frame.style.display='none';frame.setAttribute('aria-hidden','true');
        var form=document.createElement('form');form.method='POST';form.action=BASE;form.target=frameName;form.style.display='none';
        function add(k,v){var i=document.createElement('input');i.type='hidden';i.name=k;i.value=String(v==null?'':v);form.appendChild(i)}
        add('ctMinhaCariocaAction','consultarIngressoSeguro');add('ctMinhaCariocaRequestId',id);
        Object.keys(data||{}).forEach(function(k){add(k,data[k])});
        document.body.append(frame,form);pending[id]={frame:frame,form:form,done:done};
        pending[id].timer=setTimeout(function(){
          var p=pending[id];if(!p)return;delete pending[id];try{p.form.remove();p.frame.remove()}catch(_){}
          done({ok:false,erro:'A consulta demorou mais que o esperado.'});
        },20000);
        form.submit();
      }

      window.addEventListener('message',function(ev){
        var p=ev.data;if(!p||p.ctMinhaCariocaPost!==true||!p.id||!pending[p.id])return;
        var ctx=pending[p.id];delete pending[p.id];clearTimeout(ctx.timer);try{ctx.form.remove();ctx.frame.remove()}catch(_){}
        ctx.done(p);
      });

      function fail(msg){
        spinner.style.display='none';mensagem.textContent='Não foi possível abrir este ingresso.';
        erro.textContent=msg||'O link está incompleto, inválido ou expirado.';erro.style.display='block';
      }

      function render(res){
        var t=res.ingresso||{},e=res.evento||{},v=res.visual||{};
        var capa=String(v.capaUrl||v.posterUrl||'');
        var qr=String(t.qrUrl||'');
        spinner.style.display='none';abrir.style.display='none';erro.style.display='none';
        document.querySelector('.eyebrow').style.display='none';
        document.querySelector('h1').style.display='none';
        mensagem.style.display='none';
        var cover=capa?'<div class="event-cover"><img src="'+esc(capa)+'" alt=""><strong>'+esc(e.nome||'Evento Carioca Ticket')+'</strong></div>':'';
        view.classList.add('show');
        view.innerHTML=cover+
          '<span class="status">● '+esc(t.status||'Ingresso válido')+'</span>'+
          '<div class="info">'+
            '<div><small>Participante</small><strong>'+esc(t.nome||'—')+'</strong></div>'+
            '<div><small>Ingresso</small><strong>'+esc([t.tipo,t.lote].filter(Boolean).join(' · ')||'—')+'</strong></div>'+
            '<div><small>Data</small><strong>'+esc([e.data,e.horario].filter(Boolean).join(' · ')||'—')+'</strong></div>'+
            '<div><small>Local</small><strong>'+esc([e.local,e.cidade,e.uf].filter(Boolean).join(' · ')||'—')+'</strong></div>'+
          '</div>'+
          (qr?'<img class="qr" src="'+esc(qr)+'" alt="QR Code do ingresso">':'')+
          '<div class="code">'+esc(t.codigo||codigo)+'</div>'+
          '<div class="security-note">Este ingresso é individual e permite somente uma entrada. Não compartilhe o QR Code com terceiros.</div>'+
          '<div class="actions">'+
            '<a id="share-whatsapp" class="action whatsapp full" href="#" target="_blank" rel="noopener">📲 Compartilhar pelo WhatsApp</a>'+
            '<button id="share-ticket" class="action" type="button">🔗 Compartilhar ingresso</button>'+
            '<button id="save-pdf" class="action" type="button">📄 Salvar em PDF</button>'+
            '<a class="action primary" href="/minha-carioca/conta/?v=20260919-2215">Voltar para Minha Carioca</a>'+
            '<a class="action" href="/">Ver eventos</a>'+
          '</div>';

        var shareUrl=location.origin+location.pathname+
          '?v=20260919-2332&codigo='+encodeURIComponent(codigo)+
          '&sig='+encodeURIComponent(sig);
        var whatsapp=document.getElementById('share-whatsapp');
        if(whatsapp){
          whatsapp.href='https://wa.me/?text='+encodeURIComponent(
            'Meu ingresso Carioca Ticket — '+(e.nome||'Evento')+'\n'+shareUrl
          );
        }

        var shareButton=document.getElementById('share-ticket');
        if(shareButton){
          shareButton.addEventListener('click',async function(){
            var dados={title:'Ingresso Carioca Ticket',text:'Meu ingresso para '+(e.nome||'o evento'),url:shareUrl};
            if(navigator.share){
              try{await navigator.share(dados);return}catch(err){if(err&&err.name==='AbortError')return}
            }
            try{
              await navigator.clipboard.writeText(shareUrl);
              shareButton.textContent='✓ Link copiado';
              setTimeout(function(){shareButton.textContent='🔗 Compartilhar ingresso'},2200);
            }catch(_){
              window.prompt('Copie o link do ingresso:',shareUrl);
            }
          });
        }

        var pdfButton=document.getElementById('save-pdf');
        if(pdfButton){
          pdfButton.addEventListener('click',function(){window.print()});
        }
      }

      var codigoValido=/^[A-Z0-9][A-Z0-9-]{5,79}$/.test(codigo);
      var assinaturaValida=/^[A-Za-z0-9_-]{16,128}$/.test(sig);

      if(!codigoValido||!assinaturaValida){
        fail('O link está incompleto ou inválido. Solicite novamente o ingresso oficial.');
        return;
      }

      postSecure({codigo:codigo,sig:sig},function(env){
        if(env&&env.ok&&env.resultado&&env.resultado.sucesso===true){render(env.resultado);return}
        fail((env&&env.resultado&&env.resultado.mensagem)||env&&env.erro||'Não foi possível validar este ingresso.');
      });
    }());
  </script>
</body>
</html>
