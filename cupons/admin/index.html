<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#080808"><title>Campanhas | Backoffice Carioca Ticket</title><link rel="icon" href="/assets/carioca-ticket-logo.png"><script src="/pwa-register.js" defer></script>
<style>
:root{--bg:#080808;--panel:#111;--line:#292929;--gold:#d9a62e;--gold2:#f2c451;--text:#f7f2e8;--muted:#aaa39a;--danger:#ef8c8c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.hidden{display:none!important}.shell{width:min(1180px,calc(100% - 24px));margin:auto;padding:16px 0 48px}.top,.actions,.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.top{justify-content:space-between}.logo{width:70px}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:#151515;color:var(--text);text-decoration:none;font-size:11px;font-weight:900;cursor:pointer}.hero{margin-top:14px;padding:20px;border:1px solid #392f1e;border-radius:20px;background:linear-gradient(145deg,#17140e,#101010)}.hero h1{margin:5px 0}.hero p{margin:0;color:var(--muted)}.toolbar{margin:14px 0}.toolbar input,.toolbar select{min-height:42px;border:1px solid var(--line);background:#101010;color:var(--text);border-radius:10px;padding:0 11px}.toolbar input{flex:1;min-width:190px}.grid{display:grid;gap:9px}.card{border:1px solid var(--line);background:var(--panel);border-radius:15px;padding:14px}.card-top{display:flex;justify-content:space-between;gap:10px}.card h3{margin:0}.code{display:inline-block;margin-top:5px;color:#f0d27c;font:800 10px ui-monospace,monospace}.status{font-size:9px;border:1px solid #3a3a3a;border-radius:999px;padding:5px 7px}.meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-top:10px}.m{background:#0c0c0c;border-radius:9px;padding:8px}.m span{display:block;color:var(--muted);font-size:8px;text-transform:uppercase}.m b{font-size:11px}.empty{padding:30px;text-align:center;color:var(--muted)}.gate{min-height:100vh;display:grid;place-items:center;padding:20px}.gate>div{width:min(460px,100%);padding:24px;border:1px solid #392f1e;border-radius:20px;text-align:center}.gate img{width:90px}.gate p{color:var(--muted)}.confirm{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.8);display:grid;place-items:center;padding:15px}.confirm>div{width:min(440px,100%);background:#111;border:1px solid #39301e;border-radius:16px;padding:18px}.confirm textarea{width:100%;min-height:80px;background:#080808;color:#fff;border:1px solid #292929;border-radius:10px;padding:10px}@media(max-width:700px){.meta{grid-template-columns:1fr 1fr}.card-top{flex-direction:column}.top{align-items:flex-start}.actions{width:100%}.actions .btn{flex:1}}
</style></head><body>
<section id="gate" class="gate"><div><img src="/assets/carioca-ticket-logo.png" alt="Carioca Ticket"><h1>Campanhas promocionais</h1><p id="gateMsg">Validando acesso administrativo...</p></div></section>
<main id="app" class="shell hidden"><header class="top"><a href="/parceiro/admin/"><img class="logo" src="/assets/carioca-ticket-logo.png" alt="Carioca Ticket"></a><div class="actions"><a class="btn" href="/parceiro/admin/">Gestão Parceiros CT</a><a class="btn" href="/produtor/">Portal do Produtor</a></div></header>
<section class="hero"><small style="color:var(--gold2);font-weight:900">BACKOFFICE · ADMIN</small><h1>Campanhas promocionais</h1><p>Visão global para auditoria operacional. Pausa e encerramento administrativo ficam registrados.</p></section>
<div class="toolbar"><input id="term" placeholder="Código, evento ou produtor"><select id="status"><option value="">Todos os status</option><option>ATIVA</option><option>AGENDADA</option><option>PAUSADA</option><option>ESGOTADA</option><option>EXPIRADA</option><option>ENCERRADA</option><option>RASCUNHO</option></select><button id="search" class="btn">Filtrar</button></div>
<div id="list" class="grid"></div></main>
<div id="confirm" class="confirm hidden"><div><h2 id="confirmTitle">Confirmar</h2><p id="confirmText" style="color:var(--muted)"></p><textarea id="reason" placeholder="Justificativa administrativa"></textarea><div class="actions" style="justify-content:flex-end;margin-top:10px"><button id="no" class="btn">Cancelar</button><button id="yes" class="btn">Confirmar</button></div></div></div>
<script>
(function(){'use strict';var APP='https://script.google.com/macros/s/AKfycbz28keO65PIIElB8dWMBt8nnEBw9CzBxWnc6nOhAKKGNDkMZnYbWjrhTtr_v-lEI2IAJA/exec',STORAGE='CT_PORTAL_PRODUTOR_PROD_SESSION_V1',pending={},state={token:'',items:[]};
function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}function money(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function session(){try{var raw=sessionStorage.getItem(STORAGE)||localStorage.getItem(STORAGE),d=raw?JSON.parse(raw):null;return d&&d.token?d:null}catch(_){return null}}
function clean(id){var p=pending[id];if(!p)return null;delete pending[id];clearTimeout(p.timer);try{p.frame.remove();p.form.remove()}catch(_){}return p}
function rpc(method,args){return new Promise(function(resolve,reject){var id='CTCA-'+(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random()),n='ctca_'+id.replace(/\W/g,''),fr=document.createElement('iframe'),fo=document.createElement('form');fr.name=n;fr.style.display='none';fo.method='POST';fo.action=APP;fo.target=n;fo.style.display='none';function add(k,v){var i=document.createElement('input');i.type='hidden';i.name=k;i.value=String(v==null?'':v);fo.appendChild(i)}add('ctMinhaCariocaAction','portalRpc');add('ctMinhaCariocaRequestId',id);add('metodo',method);add('argsJson',JSON.stringify(args||[]));document.body.append(fr,fo);pending[id]={frame:fr,form:fo,resolve:resolve,reject:reject,timer:setTimeout(function(){var p=clean(id);if(p)p.reject(new Error('Timeout'))},45000)};fo.submit()})}
window.addEventListener('message',function(ev){if(ev.origin!=='https://script.google.com'&&!/\.googleusercontent\.com$/.test(ev.origin||''))return;var x=ev.data,p=x&&x.id?clean(x.id):null;if(!p)return;x.ok===true?p.resolve(x.resultado):p.reject(new Error(String(x.erro||'Falha')))});
function render(d){state.items=d.itens||[];var term=String(document.getElementById('term').value||'').toLowerCase(),st=document.getElementById('status').value;var xs=state.items.filter(function(c){if(st&&c.status!==st)return false;if(term&&[c.codigo,c.eventoId,c.produtorId,c.nome].join(' ').toLowerCase().indexOf(term)<0)return false;return true}),a=document.getElementById('list');a.innerHTML=xs.length?xs.map(function(c){return '<article class="card"><div class="card-top"><div><h3>'+esc(c.nome)+'</h3><span class="code">'+esc(c.codigo)+'</span></div><span class="status">'+esc(c.status)+'</span></div><div class="meta"><div class="m"><span>Produtor</span><b>'+esc(c.produtorId)+'</b></div><div class="m"><span>Evento</span><b>'+esc(c.eventoId)+'</b></div><div class="m"><span>Utilizações</span><b>'+Number(c.utilizacoes||0)+'</b></div><div class="m"><span>Receita / desconto</span><b>'+money(c.receitaGerada)+' / '+money(c.descontoTotal)+'</b></div></div><div class="actions" style="margin-top:10px">'+((c.status==='ATIVA'||c.status==='AGENDADA')?'<button class="btn" data-action="PAUSAR" data-id="'+esc(c.campanhaId)+'">Pausar</button>':'')+(c.status!=='ENCERRADA'?'<button class="btn" data-action="ENCERRAR" data-id="'+esc(c.campanhaId)+'">Encerrar</button>':'')+'</div></article>'}).join(''):'<div class="card empty">Nenhuma campanha encontrada.</div>';a.querySelectorAll('[data-action]').forEach(function(b){b.onclick=function(){confirmAction(b.dataset.id,b.dataset.action)}})}
async function load(){var s=session();if(!s){document.getElementById('gateMsg').textContent='Entre como administrador no ecossistema Carioca Ticket.';return}state.token=String(s.token);try{var d=await rpc('ctCuponsCampanhasAdminListarPROD',[state.token,{}]);if(!d||d.sucesso!==true||d.autorizado!==true)throw new Error('Acesso negado');document.getElementById('gate').classList.add('hidden');document.getElementById('app').classList.remove('hidden');render(d)}catch(e){document.getElementById('gateMsg').textContent='Acesso administrativo não autorizado.'}}
function confirmAction(id,action){var box=document.getElementById('confirm');document.getElementById('confirmTitle').textContent=action==='PAUSAR'?'Pausar campanha':'Encerrar campanha';document.getElementById('confirmText').textContent='A ação será auditada e não altera vendas anteriores.';document.getElementById('reason').value='';box.classList.remove('hidden');document.getElementById('no').onclick=function(){box.classList.add('hidden')};document.getElementById('yes').onclick=async function(){var reason=String(document.getElementById('reason').value||'').trim();if(reason.length<5){document.getElementById('confirmText').textContent='Informe uma justificativa administrativa.';return}this.disabled=true;try{await rpc('ctCuponsCampanhasAdminAlterarStatusPROD',[state.token,id,action,reason]);box.classList.add('hidden');await load()}finally{this.disabled=false}}}
document.getElementById('search').onclick=function(){render({itens:state.items})};document.getElementById('status').onchange=function(){render({itens:state.items})};load();
}());</script></body></html>
